<style>
/* ══════════════════════════════════════════════════════════════════════════
   COLD LEDGER — a statement of account, not a quiz.
   Ruled lines, not cards. The interface is blue; the money is red or green.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme: light dark;

  /* GROUND / SURFACE */
  --ground:      #F1F3F7;
  --surface:     #FFFFFF;
  --sunk:        #E4E8EF;

  /* INK */
  --ink:         #0D131C;
  --ink-soft:    #46536B;
  --ink-faint:   #59667C;

  /* LINES — decorative only, never the sole indicator of a control */
  --line:        #D2D8E3;
  --line-strong: #B7C0CF;
  --control:     #6B7789;

  /* ACCENT — interface only, never a money figure */
  --accent:      #1140CC;
  --accent-press:#0B31A0;
  --accent-soft: #E3E9FC;
  --on-accent:   #FFFFFF;

  /* MONEY OUT */
  --leak:        #B32218;
  --leak-soft:   #FCE6E3;

  /* MONEY BACK */
  --gain:        #056B4A;
  --gain-soft:   #DDF0E7;

  --focus:       #0D131C;

  /* The result's band colour. Neutral ink everywhere except the result screen,
     where it becomes red, ink or green depending on how large the leak is.
     It MUST follow --ink rather than repeat a literal, or the gate screen's
     money figure paints light-mode ink on a dark ground. */
  --band:        var(--ink);

  /* GEOMETRY */
  --r:    4px;
  --r-sm: 2px;
  --r-0:  0px;
  --max:  640px;
  --gutter: 18px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:32px; --s8:40px; --s9:56px; --s10:72px;

  --t-micro:120ms; --t-fast:180ms; --t-mid:260ms; --t-bar:420ms; --t-count:1200ms;
  --ease-out: cubic-bezier(.2,.85,.25,1);
  --ease-io:  cubic-bezier(.4,0,.2,1);

  --measure-prose: 58ch;
  --measure-hero: 34ch;

  --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display",
                  "Segoe UI", system-ui, Roboto, "Helvetica Neue",
                  "Noto Sans", Arial, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
                  "Segoe UI", system-ui, Roboto, "Helvetica Neue",
                  "Noto Sans", Arial, sans-serif;
  --font-num:     ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono",
                  "Segoe UI Mono", Consolas, "Roboto Mono", "Noto Sans Mono",
                  "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A0E15; --surface:#131A24; --sunk:#0E1520;
    --ink:#E7EDF6;    --ink-soft:#A6B2C4; --ink-faint:#8592A6;
    --line:#2A3646;   --line-strong:#354254; --control:#748296;
    --accent:#85AAFF; --accent-press:#A9C4FF; --accent-soft:#16223B; --on-accent:#05101F;
    --leak:#FF8A78;   --leak-soft:#2B1512;
    --gain:#3EDCA3;   --gain-soft:#07251B;
    --focus:#E7EDF6;
  }
}
:root[data-theme="dark"]{
  --ground:#0A0E15; --surface:#131A24; --sunk:#0E1520;
  --ink:#E7EDF6;    --ink-soft:#A6B2C4; --ink-faint:#8592A6;
  --line:#2A3646;   --line-strong:#354254; --control:#748296;
  --accent:#85AAFF; --accent-press:#A9C4FF; --accent-soft:#16223B; --on-accent:#05101F;
  --leak:#FF8A78;   --leak-soft:#2B1512;
  --gain:#3EDCA3;   --gain-soft:#07251B;
  --focus:#E7EDF6;
}

/* ── RESET ───────────────────────────────────────────────────────────────── */
*,*::before,*::after{ box-sizing:border-box; }
html{
  -webkit-text-size-adjust:100%;
  /* Keep the browser's own scroll-into-view clear of the sticky dock and the
     sticky review bar, so a keyboard-focused tile is never parked underneath
     one of them. The radio itself is a 1x1 box, so the browser cannot work
     this out from the input alone. */
  scroll-padding-bottom:180px; scroll-padding-top:64px;
}
body{
  margin:0; background:var(--ground); color:var(--ink-soft);
  font-family:var(--font-body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p,ul,ol,figure,fieldset,legend,table{ margin:0; padding:0; }
ul,ol{ list-style:none; }
fieldset{ border:0; min-width:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
img,svg{ max-width:100%; }
[hidden]{ display:none !important; }

:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.skip-link{
  position:absolute; left:var(--gutter); top:-100px; z-index:60;
  background:var(--surface); color:var(--accent); padding:10px 14px;
  border:1px solid var(--control); border-radius:var(--r); text-decoration:none;
}
.skip-link:focus{ top:8px; }

/* ── TYPE ROLES ──────────────────────────────────────────────────────────── */
.d1{ font-family:var(--font-display); font-weight:800; letter-spacing:-.035em; line-height:.92; }
.d2{ font-family:var(--font-display); font-size:28px; font-weight:700; letter-spacing:-.022em; line-height:1.16; color:var(--ink); }
.d3{ font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:-.015em; line-height:1.25; color:var(--ink); }
.h4{ font-family:var(--font-body); font-size:17px; font-weight:600; letter-spacing:-.010em; line-height:1.35; color:var(--ink); }
.body{ font-size:16px; line-height:1.55; max-width:var(--measure-prose); }
.body-sm{ font-size:15px; line-height:1.50; max-width:var(--measure-prose); }
.meta{ font-family:var(--font-num); font-size:12px; font-weight:600; letter-spacing:.09em; line-height:1.35; text-transform:uppercase; color:var(--ink-faint); }
.num{ font-family:var(--font-num); font-size:15px; font-weight:500; line-height:1.4; font-variant-numeric:tabular-nums lining-nums; }
.num-lg{ font-family:var(--font-num); font-size:19px; font-weight:700; letter-spacing:-.01em; line-height:1.1; font-variant-numeric:tabular-nums lining-nums; color:var(--ink); }
.legal{ font-size:13px; line-height:1.5; }
.mark{ color:var(--leak); font-weight:800; }
.eyebrow{ color:var(--accent); }
@media (min-width:600px){
  :root{ --gutter:24px; }
  .d2{ font-size:32px; }
}

/* ── SHELL ───────────────────────────────────────────────────────────────── */
.site-header{
  background:var(--surface); border-bottom:1px solid var(--line);
}
.site-header__in{
  max-width:var(--max); margin-inline:auto; height:52px;
  padding-inline:var(--gutter); display:flex; align-items:center; justify-content:space-between; gap:var(--s3);
}
.wordmark{ font-family:var(--font-display); font-size:17px; font-weight:700; color:var(--ink); letter-spacing:-.02em; }
.wordmark span{ font-family:var(--font-num); font-size:12px; font-weight:500; color:var(--ink-faint); letter-spacing:0; }
/* The logo lockup, when BRAND.LOGO_SRC is set. Height comes from
   BRAND.LOGO_HEIGHT_PX as an inline style; width follows the aspect ratio.
   The asset carries its own near-black ground, so it is given the page radius
   and sits as a badge rather than pretending to be a cutout. */
.wordmark img{ display:block; height:34px; width:auto; border-radius:var(--r-sm); }
.screen{
  display:flex; flex-direction:column; min-height:100dvh;
  max-width:var(--max); margin-inline:auto;
  padding:var(--s5) var(--gutter) 0;
}
.screen__body{ flex:1 1 auto; }
.stack > * + *{ margin-top:var(--s4); }
.rule{ border:0; border-top:1px solid var(--line); margin:var(--s6) 0; }

/* ── PROGRESS CHROME ─────────────────────────────────────────────────────── */
.chrome{ border-bottom:1px solid var(--line); }
.chrome__in{ max-width:var(--max); margin-inline:auto; padding:var(--s3) var(--gutter); }
.chrome__row{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s2); }
.chrome__label{ flex:1 1 auto; }
.chrome__section{ flex:0 0 auto; }
.back{
  position:relative; flex:0 0 auto; width:44px; height:44px; margin-left:-10px;
  background:none; border:0; cursor:pointer; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; border-radius:var(--r);
}
.back::before{ content:''; position:absolute; inset:-4px; }
.back i{
  display:block; width:9px; height:9px; border-left:2px solid currentColor;
  border-bottom:2px solid currentColor; transform:rotate(45deg); margin-left:3px;
}
.ticks{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:3px; height:3px; border-radius:var(--r-0); }
.ticks i{ display:block; background:var(--line); border-radius:var(--r-0); transition:background-color var(--t-fast) var(--ease-out); }
.ticks i.on{ background:var(--accent); }

/* ── DOCK ────────────────────────────────────────────────────────────────── */
.dock{
  position:sticky; bottom:0; margin-top:auto; z-index:20;
  margin-inline:calc(var(--gutter) * -1);
  padding:var(--s3) var(--gutter) max(var(--s4), env(safe-area-inset-bottom));
  background:var(--ground); border-top:1px solid var(--line);
}
.dock::before{
  content:''; position:absolute; left:0; right:0; top:-24px; height:24px;
  background:linear-gradient(to top, var(--ground), transparent);
  pointer-events:none;
}
.dock__consent{ color:var(--ink-faint); margin-bottom:var(--s2); }
.dock__note{ color:var(--ink-faint); margin-top:var(--s2); }
/* The full-bleed negative margin only makes sense for the sticky variant, which
   needs its background and top border to span the screen. Inline, it would push
   the submit button and its note flush to both bezels. */
.dock--inline{ position:static; border-top:0; margin-top:var(--s6); margin-inline:0; padding-inline:0; background:none; }
.dock--inline::before{ display:none; }

/* ── BUTTONS ─────────────────────────────────────────────────────────────── */
.cta{
  display:flex; align-items:center; justify-content:center; width:100%;
  min-height:56px; padding:8px 18px; border:1px solid transparent; border-radius:var(--r);
  background:var(--accent); color:var(--on-accent);
  font-size:17px; font-weight:700; letter-spacing:.005em; line-height:1.15;
  text-align:center; text-decoration:none; cursor:pointer;
  transition:background-color var(--t-micro) var(--ease-out), transform var(--t-micro) var(--ease-out);
}
.cta:active{ background:var(--accent-press); transform:translateY(1px); }
.cta[aria-disabled="true"]{ background:var(--sunk); color:var(--ink-faint); cursor:not-allowed; }
.cta[aria-disabled="true"]:active{ transform:none; background:var(--sunk); }
.cta[aria-busy="true"]{ pointer-events:none; }
.btn2{
  display:flex; align-items:center; justify-content:center; width:100%;
  min-height:52px; padding:8px 18px; border:1px solid var(--control); border-radius:var(--r);
  background:transparent; color:var(--ink); font-size:16px; font-weight:600;
  text-decoration:none; cursor:pointer;
  transition:transform var(--t-micro) var(--ease-out);
}
.btn2:active{ transform:translateY(1px); }
/* Both instances sit alone on their own line, so they do not qualify for the
   inline-text target exception. inline-flex keeps the link look and gives the
   control a 44px target. */
.btn3{
  display:inline-flex; align-items:center; min-height:44px;
  background:none; border:0; padding:0; cursor:pointer; color:var(--accent);
  font-size:15px; text-align:left;
  text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px;
}

/* ── TILES ───────────────────────────────────────────────────────────────── */
.q + .q{ margin-top:var(--s6); padding-top:var(--s6); border-top:1px solid var(--line); }
.q legend{ display:block; }
.q__help{ color:var(--ink-soft); margin-top:var(--s2); }
.tiles{ margin-top:var(--s4); display:flex; flex-direction:column; gap:var(--s2); }
.tile{
  position:relative; display:flex; align-items:center; gap:var(--s3);
  min-height:60px; padding:14px 14px 14px 16px;
  background:var(--surface); border:1px solid var(--control); border-radius:var(--r);
  cursor:pointer;
  transition:border-color var(--t-fast) var(--ease-out), background-color var(--t-fast) var(--ease-out), transform var(--t-micro) var(--ease-out);
}
.tile:active{ transform:translateY(1px); }
@media (hover:hover) and (pointer:fine){ .tile:hover{ border-color:var(--ink-faint); } }
.tile input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.tile__body{ flex:1 1 auto; min-width:0; }
.tile__label{ display:block; color:var(--ink); font-size:17px; font-weight:600; letter-spacing:-.01em; line-height:1.35; }
.tile__sub{ display:block; margin-top:var(--s1); color:var(--ink-soft); font-size:15px; line-height:1.5; }
.tile__box{
  flex:0 0 auto; width:20px; height:20px; border-radius:var(--r-sm);
  border:2px solid var(--control); position:relative;
  transition:background-color var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out);
}
.tile__box::after{
  content:''; position:absolute; left:5px; top:1px; width:5px; height:10px;
  border-right:2px solid var(--on-accent); border-bottom:2px solid var(--on-accent);
  transform:rotate(45deg); opacity:0;
}
/* FALLBACK FIRST, so the :has() rules below win wherever :has() is supported.
   Without these, a WebView without :has() shows no selected state and no focus
   ring at all — the questionnaire looks broken rather than degraded. The DOM
   order (input, body, box) is what makes plain sibling selectors reach both. */
.tile input:checked ~ .tile__box{ background:var(--accent); border-color:var(--accent); }
.tile input:checked ~ .tile__box::after{ opacity:1; }
.tile input:focus-visible ~ .tile__body{ outline:2px solid var(--focus); outline-offset:4px; }
.tile:has(input:checked){ border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent); }
.tile:has(input:checked) .tile__box{ background:var(--accent); border-color:var(--accent); }
.tile:has(input:checked) .tile__box::after{ opacity:1; }
.tile:has(input:focus-visible){ outline:2px solid var(--focus); outline-offset:2px; }
.tile em{ font-family:var(--font-num); font-style:normal; font-variant-numeric:tabular-nums; }

/* ── TEACHING BOX ────────────────────────────────────────────────────────── */
.note{
  margin-top:var(--s4); padding:14px 16px; background:var(--sunk);
  border:1px solid var(--line); border-left:3px solid var(--ink); border-radius:var(--r);
}
.note__t{ margin-bottom:var(--s2); }
.note__b{ color:var(--ink-soft); font-size:15px; line-height:1.5; }
.note__b b{ font-family:var(--font-num); font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
.note__n{ margin-top:var(--s2); font-family:var(--font-num); font-size:12px; color:var(--ink-faint); }

/* ── FORM ────────────────────────────────────────────────────────────────── */
.field + .field{ margin-top:var(--s5); }
.field label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:var(--s2); }
.field__row{ display:flex; align-items:stretch; }
.prefix{
  display:flex; align-items:center; padding:0 12px; background:var(--sunk);
  border:1px solid var(--control); border-right:0; border-radius:var(--r) 0 0 var(--r);
  font-family:var(--font-num); font-size:15px; color:var(--ink);
}
.input{
  flex:1 1 auto; min-width:0; height:52px; padding:0 14px;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--control); border-radius:var(--r);
  font-size:16px; line-height:1.2;
  transition:border-color var(--t-fast) var(--ease-out);
}
.prefix + .input{ border-radius:0 var(--r) var(--r) 0; }
.input:focus{ border-color:var(--accent); }
.input[aria-invalid="true"]{ border-color:var(--leak); border-left-width:3px; }
.hint{ margin-top:var(--s2); color:var(--ink-faint); font-size:13px; }
.echo{ margin-top:var(--s2); font-family:var(--font-num); font-size:13px; color:var(--ink-soft); }
.err{
  display:flex; gap:8px; margin-top:var(--s2); color:var(--leak); font-size:13px; line-height:1.5;
}
.err i{
  flex:0 0 auto; display:block; width:12px; height:12px; margin-top:3px;
  border:2px solid currentColor; border-radius:var(--r-sm);
}
.consent{
  display:flex; align-items:flex-start; gap:12px; min-height:48px; padding-top:var(--s2);
  margin-top:var(--s6); cursor:pointer;
}
.consent input{ flex:0 0 auto; width:24px; height:24px; margin:2px 0 0; accent-color:var(--accent); }
.consent span{ font-size:13px; line-height:1.5; color:var(--ink-soft); }
.disclose{ margin-top:var(--s3); }
.disclose summary{
  font-size:13px; color:var(--accent); cursor:pointer; padding:12px 0;
  text-decoration:underline; text-underline-offset:3px;
}
.disclose ul{ margin-top:var(--s2); }
.disclose li{ font-size:13px; line-height:1.5; color:var(--ink-soft); padding:6px 0; border-top:1px solid var(--line); }

/* ── RESULT BAND TOKEN — honest calibration, made visual ─────────────────── */
.result{ --band: var(--ink); }
.result[data-band="heavy"]{ --band: var(--leak); }
.result[data-band="moderate"]{ --band: var(--ink); }
.result[data-band="lean"]{ --band: var(--gain); }

/* ── MONEY PANEL ─────────────────────────────────────────────────────────── */
.panel{
  background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--band);
  border-radius:var(--r); padding:24px 18px 20px;
}
.panel__k{ margin-bottom:var(--s5); }
.money{
  font-family:var(--font-display);
  font-size:var(--money-size, clamp(38px, 11vw, 72px));
  font-weight:800; letter-spacing:-.035em; line-height:.92;
  font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1, "lnum" 1;
  color:var(--band);
  display:flex; align-items:baseline; gap:.06em; white-space:nowrap; margin:0;
}
/* The last-resort fallback in fitMoney(). .money is a flex row, so it needs
   flex-wrap as well as white-space to be able to break at all. */
.money--wrap{ white-space:normal; flex-wrap:wrap; }
.money__cur{ font-size:.52em; font-weight:600; letter-spacing:-.01em; }
.money__num{ font-variant-numeric:tabular-nums lining-nums; }
.money--sm{ --money-size:clamp(30px, 8.5vw, 46px); }
.rail{
  height:1px; background:var(--band); margin-top:var(--s4);
  transform:scaleX(0); transform-origin:left;
}
.rail.on{ transform:scaleX(1); transition:transform var(--t-count) linear; }
.rail.instant{ transform:scaleX(1); }
.basis{ margin-top:var(--s4); color:var(--ink-soft); font-size:13px; line-height:1.5; opacity:0; }
.basis.on{ opacity:1; transition:opacity var(--t-fast) var(--ease-out); }
.basis b{ font-family:var(--font-num); font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }

/* ── LEAK ROWS ───────────────────────────────────────────────────────────── */
.leaks{ margin-top:var(--s2); }
.leakrow{ padding:var(--s4) 0; border-bottom:1px solid var(--line); }
.leakrow:first-child{ border-top:1px solid var(--line); }
.leakrow__top{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); }
.leakrow__amt{ flex:0 0 auto; text-align:right; }
.leakrow__amt.nil{ font-size:15px; font-weight:600; color:var(--gain); }
.track{ height:6px; background:var(--sunk); border-radius:var(--r-0); margin-top:var(--s3); }
.track i{ display:block; height:100%; width:0; background:var(--leak); border-radius:var(--r-0); }
.track i.on{ width:var(--w,0%); transition:width var(--t-bar) var(--ease-out); }
.track i.instant{ width:var(--w,0%); }
.leakrow__x{ margin-top:var(--s2); color:var(--ink-soft); font-size:15px; line-height:1.5; opacity:0; }
.leakrow__x.on{ opacity:1; transition:opacity var(--t-fast) var(--ease-out); }

/* ── METHOD DISCLOSURE ───────────────────────────────────────────────────── */
.method__btn{
  display:flex; align-items:center; justify-content:space-between; gap:var(--s3);
  width:100%; min-height:48px; padding:12px 14px; text-align:left; cursor:pointer;
  background:var(--sunk); border:1px solid var(--line); border-radius:var(--r); color:var(--ink);
}
.method__btn i{ flex:0 0 auto; width:8px; height:8px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg) translate(-2px,-2px); }
.method__btn[aria-expanded="true"] i{ transform:rotate(-135deg) translate(-2px,-2px); }
.method__wrap{ display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--t-mid) var(--ease-io); }
.method__wrap.open{ grid-template-rows:1fr; }
.method__in{ overflow:hidden; }
.method__pad{ padding:var(--s4) 14px 0; }
.wline{ padding:var(--s3) 0; border-bottom:1px solid var(--line); font-family:var(--font-num); font-size:13px; line-height:1.6; color:var(--ink-soft); }
.wline b{ display:block; color:var(--ink-faint); font-size:12px; letter-spacing:.09em; text-transform:uppercase; margin-bottom:4px; }
.assume{ margin-top:var(--s4); }
.assume li{ font-size:13px; line-height:1.5; color:var(--ink-soft); padding:6px 0; }

/* ── WHAT CHANGES ────────────────────────────────────────────────────────── */
.fixrow{ padding:var(--s4) 0; border-bottom:1px solid var(--line); }
.fixrow:first-child{ border-top:1px solid var(--line); }
.fixrow__top{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); }
.fixrow__gain{ flex:0 0 auto; font-family:var(--font-num); font-size:15px; font-weight:600; color:var(--gain); font-variant-numeric:tabular-nums; }
.fixrow__d{ margin-top:var(--s2); color:var(--ink-soft); font-size:15px; }
.fixrow__n{ margin-top:var(--s1); color:var(--ink-faint); font-size:13px; }
.fixlist{ margin-top:var(--s3); }
.fixlist li{ position:relative; padding:6px 0 6px 18px; color:var(--ink-soft); font-size:15px; line-height:1.5; }
.fixlist li::before{ content:''; position:absolute; left:0; top:14px; width:6px; height:6px; background:var(--ink-faint); }

/* ── TABLE ───────────────────────────────────────────────────────────────── */
.tscroll{ overflow-x:auto; margin-top:var(--s4); }
table{ border-collapse:collapse; width:100%; min-width:320px; }
caption{ text-align:left; margin-bottom:var(--s3); }
thead th{ background:var(--sunk); text-align:left; }
th,td{ padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
tbody th{ text-align:left; font-weight:400; color:var(--ink-soft); font-size:15px; }
td{ font-family:var(--font-num); font-size:15px; font-weight:500; text-align:right; font-variant-numeric:tabular-nums lining-nums; color:var(--ink); white-space:nowrap; }
.colb{ border-left:2px solid var(--accent); }
.better{ color:var(--gain); font-weight:600; }
tfoot th,tfoot td{ border-top:2px solid var(--ink); border-bottom:0; }
tfoot th{ font-weight:700; color:var(--ink); }
tfoot td{ font-family:var(--font-num); font-size:19px; font-weight:700; letter-spacing:-.01em; }
.diffstrip{
  display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
  margin-top:var(--s4); padding:14px 16px; background:var(--gain-soft); border-radius:var(--r);
}
.diffstrip b{ font-family:var(--font-num); font-size:20px; font-weight:700; color:var(--gain); font-variant-numeric:tabular-nums; }
.tnote{ margin-top:var(--s3); color:var(--ink-faint); font-size:13px; }

/* ── PROOF / FOOTER / MISC ───────────────────────────────────────────────── */
.proof__row{ display:flex; flex-wrap:wrap; gap:var(--s2) 0; }
.proof__row li{ padding:0 12px; border-left:1px solid var(--line); }
.proof__row li:first-child{ padding-left:0; border-left:0; }
.stats{ margin-top:var(--s4); }
.stats li{ display:flex; gap:10px; align-items:baseline; padding:6px 0; }
.stats b{ font-family:var(--font-num); font-size:15px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
.stats span{ font-size:15px; color:var(--ink-soft); }
.outcomes li{ padding:6px 0; font-size:15px; color:var(--ink-soft); }
.outcomes b{ color:var(--ink); font-weight:600; }
.outcomes small{ display:block; font-size:13px; color:var(--ink-faint); }
.site-footer{ border-top:1px solid var(--line); margin-top:var(--s7); }
.site-footer__in{
  max-width:var(--max); margin-inline:auto; padding:var(--s6) var(--gutter);
  font-family:var(--font-num); font-size:12px; line-height:1.9; color:var(--ink-faint);
}
.site-footer a{ color:var(--accent); }
.resume{ margin-top:var(--s5); padding:16px; background:var(--sunk); border:1px solid var(--line); border-radius:var(--r); }
.resume__row{ display:flex; gap:var(--s2); margin-top:var(--s3); }
.resume__row .btn2{ min-height:48px; }
.leaklist li{ padding:var(--s4) 0; border-top:1px solid var(--line); }
.leaklist b{ display:block; }
.leaklist p{ margin-top:var(--s2); color:var(--ink-soft); font-size:15px; line-height:1.5; max-width:var(--measure-prose); }

/* ── the fee ladder ── the landing page's one visual argument: spend up,
   cut up, nothing extra. The cut column carries the leak colour. */
.taxtable{ width:100%; min-width:0; border-collapse:collapse; font-variant-numeric:tabular-nums; }
.taxtable th{ text-align:left; padding:0 0 8px; border-bottom:1px solid var(--line); font-weight:500; white-space:normal; letter-spacing:.06em; }
.taxtable td{ padding:12px 0; border-bottom:1px solid var(--line); font-size:16px; font-weight:600; }
@media (min-width:400px){ .taxtable td{ font-size:18px; } }
.taxtable th:first-child, .taxtable td:first-child{ text-align:left; }
.taxtable th:last-child, .taxtable td:last-child{ text-align:right; }
.taxtable .taxcut{ color:var(--leak); font-weight:800; }
.taxextra{ margin-top:var(--s3); color:var(--ink-soft); }
.taxfoot{ margin-top:var(--s2); font-weight:700; color:var(--ink); }

/* the grievance line under a live fee leak — ink, not soft: it is the point */
.leakrow__sting{ margin-top:var(--s2); font-size:15px; line-height:1.5; font-weight:600; color:var(--ink); max-width:var(--measure-prose); }
/* the ref-code line under the call ask */
.refnote{ margin-top:var(--s2); color:var(--accent); font-weight:600; }
/* the WhatsApp group link under the call ask — .btn2, deliberately not .cta:
   there is exactly one primary action on this screen and it is in the dock */
.wagroup{ margin-top:var(--s5); }

/* ── who-we-are highlight card ── the first thing after the hero */
.proofcard{ background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--accent); padding:var(--s4); }
.proofcard .stats b{ color:var(--accent); }

/* ── fit strip ── plain nouns in pills */
.fitrow{ display:flex; flex-wrap:wrap; gap:8px; list-style:none; margin:0; padding:0; }
.fitrow li{ border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  padding:8px 14px; border-radius:999px; font-size:14px; }

/* ── people rows ── named client results, screenshot treatment */
.people{ list-style:none; margin:0; padding:0; }
.people li{ display:flex; gap:14px; padding:var(--s4) 0; border-top:1px solid var(--line); }
.avatar{ flex:none; width:48px; height:48px; border-radius:50%;
  background:var(--accent-soft); color:var(--accent); display:flex;
  align-items:center; justify-content:center; font-weight:700; font-size:15px; }
.people__col{ min-width:0; }
.people__name{ display:block; font-size:17px; }
.people__role{ color:var(--ink-faint); font-size:14px; margin:2px 0 6px; }
.people__claim{ color:var(--ink-soft); font-size:15px; line-height:1.5; }

/* ── ambient background layer ── one fixed div behind everything. The scrim is
   baked into its background-image by applyBg(), so no combination of config
   values can put low-contrast text over a bright region. Empty config → the
   layer never gets .on and this is all inert. */
#bgLayer{ position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-position:center; background-size:cover; background-repeat:no-repeat;
  opacity:0; transition:opacity .6s ease; }
#bgLayer.on{ opacity:1; }
@media (prefers-reduced-motion:reduce){ #bgLayer{ transition:none; } }
.calcline{ padding:var(--s3) 0; border-bottom:1px solid var(--line); font-family:var(--font-num); font-size:13px; color:var(--ink-soft); }
.hgroup{ margin-bottom:var(--s6); }
.hgroup .d2{ max-width:var(--measure-hero); }
.eyebrow{ margin-bottom:var(--s3); }
.sub{ margin-top:var(--s4); }
.blk{ margin-top:var(--s6); padding-top:var(--s6); border-top:1px solid var(--line); }
.blk--tight{ margin-top:var(--s5); padding-top:0; border-top:0; }
.stmt{ display:flex; flex-wrap:wrap; gap:0 10px; margin-bottom:var(--s4); }
.verdict{ margin-top:var(--s6); }
.verdict p{ margin-top:var(--s3); color:var(--ink-soft); }
.keep{ margin-top:var(--s4); color:var(--ink-faint); font-size:13px; }
.softfail{ margin-top:var(--s4); padding:12px 14px; border:1px solid var(--leak); border-left-width:3px; border-radius:var(--r); color:var(--leak); font-size:13px; }
.review{ position:sticky; top:0; z-index:15; margin-inline:calc(var(--gutter) * -1); padding:10px var(--gutter); background:var(--sunk); border-bottom:1px solid var(--line); font-size:13px; color:var(--ink-soft); }

/* ── MOTION ──────────────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important; scroll-behavior:auto !important;
  }
}
/* ── HIGH CONTRAST ───────────────────────────────────────────────────────── */
@media (prefers-contrast: more){
  :root{ --control:var(--ink-soft); --line:var(--ink-soft); }
  .tile:has(input:checked){ background:var(--surface); box-shadow:inset 0 0 0 2px var(--accent); }
  .note,.method__btn,.prefix{ background:var(--surface); border-width:2px; }
  .diffstrip{ background:var(--surface); border:2px solid var(--gain); }
  .panel{ border-width:2px; border-top-width:3px; }
}
/* ── PRINT ───────────────────────────────────────────────────────────────── */
@media print{
  :root{
    --ground:#FFFFFF; --surface:#FFFFFF; --sunk:#F1F3F7;
    --ink:#000000; --ink-soft:#222222; --ink-faint:#444444;
    --line:#BBBBBB; --line-strong:#999999; --control:#666666;
    --accent:#0B31A0; --leak:#8A1A12; --gain:#04553B;
  }
  .site-header,.chrome,.dock,.skip-link{ display:none !important; }
  .screen{ min-height:0; padding:0; }
  .method__wrap{ grid-template-rows:1fr !important; }
  .money,.basis,.leakrow__x{ opacity:1 !important; }
  .rail{ transform:scaleX(1) !important; }
  a[href]::after{ content:" (" attr(href) ")"; font-size:11px; }
}
</style>

  /* ── 7. THE MONEY MODEL ───────────────────────────────────────────────────
     These constants ARE the argument. Every one is defensible from RevX's own
     published pages or from published agency-fee ranges. Change a number here
     and the page, the working shown to the visitor, the comparison table and
     the CRM payload all move together. Nothing below duplicates these values.

  MODEL: {
    VERSION: 'leak-v1.0',

    /* What a flat, all-in managed stack costs per month at each spend band.
       This is the BENCHMARK the percentage model is measured against — it is
       not a price list and it is not a RevX quote. Keyed by q_spend option id.
       Any band left 0 falls back to BENCHMARK_SHARE with BENCHMARK_FLOOR.     */
    FLAT_BENCHMARK_MONTHLY: {
      lt50k: 0, '50k_1l': 0, '1_3l': 0, '3_5l': 0, '5_10l': 0, '10_20l': 0, gt20l: 0
    },
    /* Basis: RevX's own published comparison — ₹9,00,000 a year of flat fee
       against ₹10,00,000 a month of ad spend. 9,00,000 / 1,20,00,000 = 7.5%.
       READ THIS BEFORE CHANGING IT. The benchmark is a CREDIT against the fee
       leak (fee = pctAnnual − (benchAnnual − flatAnnual)), so a LOWER benchmark
       produces a LARGER leak, not a smaller one. An earlier 6% was described
       here as "kinder to the % model" — it was the opposite, overstating the
       fee leak by up to ₹4,50,000 a year at the top band. We now model RevX's

       more conservative of the two.                                          */

    BENCHMARK_FLOOR_MONTHLY: 50000,   // no flat all-in fee is modelled below this

    /* Basis: you would pay for a funnel builder and an email tool whatever you

    COORD_HOURS_PER_EXTRA_VENDOR_MONTHLY: 3,

    OPS_AUTOMATABLE_SHARE: 0.50,

    MATERIAL_LEAK_ANNUAL:     500000, // above this a low-ratio account is still offered

    BAND_PCT: 0.15,                   // the plus/minus band around the point estimate

  var M = CONFIG.MODEL;
  var I = readInputs(answers);
  var raw = computeLeaks(I);
  var g = applyGuards(raw, raw.annualSpend);
  var rr = roundAndReconcile(g.leaks, raw.annualSpend);
  var share = raw.annualSpend > 0 ? rr.total / raw.annualSpend : 0;
  var tier = pickTier(share);

  var biggest = '';
  LEAK_KEYS.forEach(function(k){ if (rr.leaks[k] > 0 && (!biggest || rr.leaks[k] > rr.leaks[biggest])) biggest = k; });

  /* Two parallel lists on purpose: valueKey is the CRM column, assumed_label is
     what a visitor reads. The rendered sentence used to print the raw column
     names ("tool spend monthly inr") inside the panel that asks to be checked. */
  var assumed = [], assumedLabels = [];
  CONFIG.QUESTIONS.forEach(function(q){
    var o = optionOf(q.id, answers);
    if (o && o.flags && o.flags.indexOf('assumed') >= 0 && q.valueKey){
      assumed.push(q.valueKey);
      assumedLabels.push(q.assumed_label || q.title);
    }
  });
  /* The visitor was never asked for an hourly rate when the follow-up did not
     appear, so the default we used is disclosed like any other assumption. */
  var usedDefaultRate = !I.ownerGiven && (rr.leaks.ops > 0 || rr.leaks.vendors > 0);

  /* Clamped, not merely configured small: the result page claims in print that
     a recovery figure is never larger than the leak above it. */
  var recovery = {}, recoveryTotal = 0;
  LEAK_KEYS.forEach(function(k){
    var share2 = num(M.RECOVERY[k]);
    var v = roundTo(rr.leaks[k] * share2, leakUnit(rr.leaks[k] * share2));
    v = Math.min(v, rr.leaks[k]);
    recovery[k] = v; recoveryTotal += v;
  });

  var small = rr.total < M.SMALL_LEAK_FLOOR_ANNUAL;
  var material = rr.total >= M.MATERIAL_LEAK_ANNUAL;

  return Object.freeze({
    model_version: M.VERSION,
    inputs: I,
    detail: raw,
    qualified: I.spendM >= M.QUALIFY_MIN_SPEND_MONTHLY,
    annual_spend: raw.annualSpend,
    leaks: rr.leaks,
    recovery: recovery,
    recovery_total: recoveryTotal,
    total: rr.total, low: rr.low, high: rr.high, band_unit: rr.bandUnit,
    share: share,
    monthly: roundTo(rr.total/12, 1000),
    biggest: biggest,
    tier: tier,
    /* Nobody below the modelled range and nobody whose leak is under the floor
       is asked for a call, whatever their ratio says. A 'none' tier is offered
       the call only when the absolute figure is material — with copy saying so. */
    show_call: (I.spendM >= M.QUALIFY_MIN_SPEND_MONTHLY) && !small &&
               (tier.cta === 'call' || material),
    tier_material: tier.cta === 'none' && material && !small &&
               (I.spendM >= M.QUALIFY_MIN_SPEND_MONTHLY),
    capped: rr.capped,
    single_capped: g.singleCapped || rr.singleCapped,
    small: small,
    material: material,
    assumed_inputs: assumed,
    assumed_labels: assumedLabels,
    used_default_rate: usedDefaultRate,
    working: buildWorking(I, raw, rr.leaks)
  });
}

/* One line of plain arithmetic per leak, with the visitor's own numbers in it.
   This block is the whole differentiator for a numerate buyer, and it makes the
   model self-auditing: if a line reads absurdly, the constant is wrong and
   anyone can see it. */
function buildWorking(I, raw, rounded){
  var M = CONFIG.MODEL, w = {};
  var mo = formatINR(I.spendM), annual = formatINR(raw.annualSpend);
  var pctTxt = Math.round(I.feePct*1000)/10 + '%';

  if (rounded.fee > 0){
    var lead = mo + ' a month × 12 × ' + pctTxt + ' = ' + formatINR(raw.pctAnnual) + ' a year of percentage fee.';
    var credit = raw.benchAnnual - raw.flatAnnual;
    if (credit > 0) lead += ' Less ' + formatINR(credit) + ' — what a flat all-in fee would cost at this spend, net of what you already pay flat.';
    else lead += ' Your retainer already covers what a flat all-in fee would cost, so none of the percentage is credited back.';
    w.fee = lead + ' → ' + formatINR(rounded.fee);
  } else if (I.feeModel === 'pct' || I.feeModel === 'hybrid'){
    w.fee = 'Your ' + pctTxt + ' comes to ' + formatINR(raw.pctAnnual) + ' a year, which is under the ' +
            formatINR(raw.benchAnnual) + ' a flat all-in fee would cost at ' + mo + ' a month. Nothing modelled.';
  } else {
    w.fee = 'You do not pay a percentage of ad spend, so there is nothing here that grows when you scale. Nothing modelled.';
  }

  var toolsBase = Math.max(0, I.toolsM - M.TOOLS_FLOOR_MONTHLY);
  w.tools = rounded.tools > 0
    ? '(' + formatINR(I.toolsM) + ' − ' + formatINR(M.TOOLS_FLOOR_MONTHLY) + ' you would pay whatever you did) × 12 × ' +
      Math.round(I.overlap*100) + '% overlap = ' + formatINR(toolsBase*12*I.overlap) + ' → ' + formatINR(rounded.tools)
    : 'Your tool bill is at or under the ' + formatINR(M.TOOLS_FLOOR_MONTHLY) + ' a month floor the model treats as unavoidable. Nothing modelled.';

  w.tracking = rounded.tracking > 0
    ? annual + ' of annual media × ' + Math.round(I.wasteRate*100) + '% you cannot attribute = ' + formatINR(raw.tracking) +
      ' of misallocated spend. This is media pointed at the wrong campaign, not revenue you lost.'
    : 'You told us your measurement is wired. The model puts nothing here.';

  if (rounded.vendors > 0){
    w.vendors = raw.extraVendors + ' part' + (raw.extraVendors === 1 ? 'y' : 'ies') + ' beyond the first × ' +
      M.COORD_HOURS_PER_EXTRA_VENDOR_MONTHLY + ' hours a month × ' + formatINR(I.opsHourly) + ' an hour × 12 = ' +
      formatINR(raw.vendorsRaw) +
      (raw.vendorCapped ? ', held down to ' + formatINR(rounded.vendors) + ' by the ' + Math.round(M.VENDOR_LEAK_CAP_SHARE*100) + '% ceiling.' : ' → ' + formatINR(rounded.vendors));
  } else {
    w.vendors = 'One party owns your stack, so there is no handoff to pay for. Nothing modelled.';
  }

  w.ops = rounded.ops > 0
    ? I.opsHours + (I.opsHours === 1 ? ' hour' : ' hours') + ' a week × 52 × ' + formatINR(I.opsHourly) + ' an hour × ' +
      Math.round(M.OPS_AUTOMATABLE_SHARE*100) + '% a stack can actually remove = ' +
      formatINR(raw.ops) + ' → ' + formatINR(rounded.ops)
    : 'Under two hours a week by hand. There is not enough there to model.';

  return w;
}
/* MODEL:END */

  if (!state.startedAt) return;

    v: CONFIG.BEHAVIOUR.STORAGE_SCHEMA, pv: CONFIG.META.PAGE_VERSION, at: Date.now(),
    screen: state.screen, answers: state.answers, submissionId: state.submissionId,

  if (!s || s.v !== CONFIG.BEHAVIOUR.STORAGE_SCHEMA){ clearSnapshot(); return null; }

  if (ageH > CONFIG.BEHAVIOUR.RESTORE_TTL_HOURS){ clearSnapshot(); return null; }
  var valid = {};

    var a = s.answers[qid];

/* ── conditional follow-ups, built once from the declarative reveals ──────── */
var DEPENDENTS = (function(){
  var m = {};
  CONFIG.QUESTIONS.forEach(function(q){
    (q.reveals||[]).forEach(function(r){

    });

  (DEPENDENTS[qid] || []).forEach(function(rule){

      delete answers[rule.child];
      clearDependentsIn(rule.child, answers);

}

    return r.when.indexOf(state.answers[qid]) >= 0;

/* No diagnostic_start mapping: the tags only load once a consent decision
   exists, which is on the gate screen, so nothing above it can ever reach fbq.
   A mapping that can never fire is a lie to whoever reads this map. */
var META_EVENT = { lead_submitted:'Lead', booking_cta_click:'Schedule' };
function noteTagFailure(name, why){
  var k = why; state.tagFailures[k] = (state.tagFailures[k]||0) + 1;
  if (DEBUG) console.warn('[revx] tag failure', name, why);
}
var tagsLoaded = false;
/* Set when a visitor ticks the consent box, cleared when they untick it. GTM

   platform after a withdrawal. */
var tagsConsented = false;
function track(name, params){
  var p = Object.assign({ event:name, funnel:'revx_scale_tax',
                          page_version: CONFIG.META.PAGE_VERSION,
                          model_version: CONFIG.MODEL.VERSION }, params||{});
  if (tagsLoaded && !tagsConsented) return;      /* consent withdrawn */
  try { (window.dataLayer = window.dataLayer || []).push(p); } catch(e){ noteTagFailure(name,'dl'); }
  try {
    if (window.fbq){
      var map = META_EVENT[name];
      var meta = Object.assign({}, params||{}, { funnel:'revx_scale_tax' });
      var opts = p.event_id ? { eventID: p.event_id } : undefined;
      if (map) window.fbq('track', map, meta, opts);
      else     window.fbq('trackCustom', name, meta, opts);
    } else if (cfg('INTEGRATIONS.META_PIXEL_ID') && tagsLoaded){
      /* Only after the tags were asked to load. Counting the whole pre-consent
         funnel as a failure made tag_failures permanently red and useless as
         the alarm it exists to be. */
      noteTagFailure(name, 'fbq_missing');

}
function loadTags(){
  if (tagsLoaded) return; tagsLoaded = true;
  var pid = cfg('INTEGRATIONS.META_PIXEL_ID');
  var gtm = cfg('INTEGRATIONS.GTM_ID');
  /* Consent is a forward boundary, not a retroactive one: GTM replays whatever
     is already sitting in dataLayer the moment it loads, which would ship the
     entire pre-consent answer trail. */
  if (gtm){ try { window.dataLayer = []; } catch(e){} }
  if (pid){
    /* Standard Meta base code, run only once a consent decision exists. */
    (function(f,b,e,v,n,t2,s){ if(f.fbq)return; n=f.fbq=function(){ n.callMethod ?
      n.callMethod.apply(n,arguments) : n.queue.push(arguments); };
      if(!f._fbq)f._fbq=n; n.push=n; n.loaded=!0; n.version='2.0'; n.queue=[];
      t2=b.createElement(e); t2.async=!0; t2.src=v; s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t2,s); })(window, document, 'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    try { window.fbq('init', pid); window.fbq('track','PageView'); } catch(e){ noteTagFailure('init','fbq_threw'); }
  }

    (function(w,d,s,i){ w.dataLayer=w.dataLayer||[];
      w.dataLayer.push({'gtm.start': new Date().getTime(), event:'gtm.js'});
      var f=d.getElementsByTagName(s)[0], j=d.createElement(s);
      j.async=true; j.src='https://www.googletagmanager.com/gtm.js?id='+i;
      f.parentNode.insertBefore(j,f); })(window, document, 'script', gtm);
  }
}
function newSubmissionId(){

  } catch(e){ r = Math.random().toString(36).slice(2,14); }

  return fs;
}
function mountQuestion(qid){
  var q = questionById(qid); if (!q) return;
  var host = $('#qBody'); clear(host);
  var h1 = el('h1','d2', q.title);
  h1.setAttribute('data-screen-heading',''); h1.setAttribute('tabindex','-1');
  host.appendChild(h1);
  host.appendChild(fieldsetFor(q,false));
  revealedChildren(qid).forEach(function(cid){
    var c = questionById(cid); if (c) host.appendChild(fieldsetFor(c,true));
  });
  setHidden($('#reviewBar'), !state.reviewMode);
  refreshContinue();
}
function setAnswer(qid, optionId){
  var changed = state.answers[qid] !== optionId;
  var q = questionById(qid);
  state.answers[qid] = optionId;
  if (!state.startedAt) state.startedAt = Date.now();
  if (changed && state.computedAt) state.corrections++;
  clearDependentsIn(qid, state.answers);
  /* Which question, not which answer. The chosen option reaches our own CRM in
     the payload, which the consent notice describes; it does not need to reach
     Meta or a tag container on every tap for drop-off analysis to work. */
  track('question_answer', { qid: qid });
  persist();
  if (DEPENDENTS[qid] && changed){
    var parent = q.inline ? q.parent : qid;
    mountQuestion(state.screen && isQuestionScreen(state.screen) ? qidOf(state.screen) : parent);
    var back = document.querySelector('input[name="'+qid+'"][value="'+optionId+'"]');
    if (back){
      back.checked = true;
      /* The remount above removed the focused radio from the document, which
         drops focus to <body> and breaks arrow-key navigation of the group. */
      try { back.focus({ preventScroll:true }); } catch(e){}
    }
  }
  refreshContinue();
}
/* Multi-select twin of setAnswer. The answer is an array of option ids; an
   emptied array is deleted outright so the Continue gate's `!== undefined`
   check means "at least one picked" for both kinds. Multi questions carry no
   reveals, so the remount branch in setAnswer has no twin here. */
function toggleAnswer(qid, optionId){
  var cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  var at = cur.indexOf(optionId);
  if (at >= 0) cur.splice(at, 1); else cur.push(optionId);
  if (cur.length) state.answers[qid] = cur; else delete state.answers[qid];
  if (!state.startedAt) state.startedAt = Date.now();
  if (state.computedAt) state.corrections++;
  track('question_answer', { qid: qid });
  persist();
  refreshContinue();
}
function pendingChild(qid){
  var kids = revealedChildren(qid);
  for (var i=0;i<kids.length;i++) if (state.answers[kids[i]] === undefined) return kids[i];
  return '';
}
function refreshContinue(){
  if (!isQuestionScreen(state.screen)) return;
  var qid = qidOf(state.screen);
  var btn = $('#nextBtn'), why = $('#nextWhy');
  var last = stepIndex(qid) === STEPS.length - 1;
  btn.textContent = state.reviewMode ? cfg('COPY.questions.recalc')
                  : (last ? cfg('COPY.questions.last') : cfg('COPY.questions.next'));
  var ok = state.answers[qid] !== undefined && !pendingChild(qid);
  btn.setAttribute('aria-disabled', ok ? 'false' : 'true');
  why.textContent = ok ? cfg('COPY.questions.ready')
    : (state.answers[qid] === undefined ? cfg('COPY.errors.blocked_next') || cfg('COPY.questions.blocked_next')
                                        : cfg('COPY.questions.blocked_sub'));
}
function onNext(){
  var qid = qidOf(state.screen);
  var ok = state.answers[qid] !== undefined && !pendingChild(qid);
  if (!ok){ alertSay($('#nextWhy').textContent); return; }
  if (state.reviewMode){ recalculate(); return; }
  var i = stepIndex(qid);
  if (i < STEPS.length - 1){ goTo(screenIdFor(STEPS[i+1])); return; }
  runCompute();
}
function runCompute(){
  state.result = compute(state.answers);
  state.computedAt = Date.now();
  if (!state.submissionId) state.submissionId = newSubmissionId();
  track('leak_computed', {
    event_id: state.submissionId, value: state.result.total, currency:'INR',
    tier: state.result.tier.id, biggest: state.result.biggest,
    share_pct: Math.round(state.result.share*1000)/10, qualified: state.result.qualified
  });
  persist();
  var ms = RM ? 0 : num(CONFIG.BEHAVIOUR.CALC_MS);
  if (!ms){ renderGate(); goTo('gate'); return; }
  renderCalc();
  goTo('calc', { noHistory:true });
  setTimeout(function(){
    if (state.screen !== 'calc') return;
    renderGate(); goTo('gate');
  }, ms);
}
function renderCalc(){
  var R = state.result;
  setText($('#calcH1'), cfg('COPY.calc.title'));
  var host = $('#calcLines'); clear(host);
  var vars = {
    annual_spend: formatINR(R.annual_spend),
    cap_pct: Math.round(CONFIG.MODEL.MAX_TOTAL_SHARE_OF_SPEND*100)
  };
  (cfg('COPY.calc.lines') || []).forEach(function(line){
    var s = tOrNull(line, vars); if (s === null) return;
    host.appendChild(el('li','calcline', s));
  });
}
function recalculate(){
  var before = state.result ? state.result.total : 0;
  state.result = compute(state.answers);
  state.payloadVersion++;
  /* The real change, not a hardcoded zero. The parameter names the movement in
     the modelled figure, and it always reported none. */
  var after = state.result.total;
  track('recalculated', {
    delta_pct: before > 0 ? Math.round((after - before) / before * 1000) / 10 : 0,
    delta_inr: after - before
  });
  renderResult();
  goTo('result', { replace:true });
  revealMoney();
  if (state.lead) send(buildPayload());
}

   VALIDATION
   ══════════════════════════════════════════════════════════════════════════════ */
function validateName(raw){
  var v = String(raw||'').trim().replace(/\s+/g,' ').slice(0,60);
  if (!v) return { ok:false, key:'name_empty' };
  if (v.length < 2) return { ok:false, key:'name_short' };
  if (!/[A-Za-zÀ-ɏऀ-ॿ]/.test(v)) return { ok:false, key:'name_short' };
  return { ok:true, value:v };
}
function validateEmail(raw){
  var v = String(raw||'').trim().toLowerCase().slice(0,254);
  if (!v) return { ok:false, key:'email_empty' };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@.]{2,}$/.test(v)) return { ok:false, key:'email_shape' };
  return { ok:true, value:v };
}
/**
 * Accepts: '+919876543210' · '919876543210' · '09876543210' · '98765 43210'
 *          '+91 (98765) 43210' · '0091-98765-43210' · '9876543210'
 * ORDER IS LOAD-BEARING. A valid 10-digit Indian mobile can itself begin '91'
 * (9198765432), so the country code is ONLY stripped when the string is longer
 * than 10 digits. Stripping '91' unconditionally mangles real numbers — that is
 * the exact class of failure this function exists to kill.
 */
function normalisePhoneIN(raw){
  var s = String(raw == null ? '' : raw);
  var d = s.replace(/\D+/g, '');
  if (!d) return { ok:false, key:'phone_empty', n:0 };
  if (d.length > 10 && d.slice(0,2) === '00') d = d.slice(2);
  if (d.length > 10 && d.slice(0,2) === '91') d = d.slice(2);
  if (d.length === 11 && d[0] === '0')        d = d.slice(1);
  if (d.length > 10 && d.slice(0,2) === '91') d = d.slice(2);
  if (d.length < 10) return { ok:false, key:'phone_short', n:d.length };
  if (d.length > 10) return { ok:false, key:'phone_long',  n:d.length };
  if (!/^[6-9]/.test(d)) return { ok:false, key:'phone_start', n:10 };
  return { ok:true, value:d, e164:'+91'+d, n:10 };
}
function prettyPhone(d){ return '+91 ' + d.slice(0,5) + ' ' + d.slice(5); }

var FIELDS = {
  name:  { input:'#fName',  err:'#eName',  run:function(){ return validateName($('#fName').value); } },
  phone: { input:'#fPhone', err:'#ePhone', run:function(){ return normalisePhoneIN($('#fPhone').value); } },
  email: { input:'#fEmail', err:'#eEmail', run:function(){ return validateEmail($('#fEmail').value); } }
};
function showError(field, res){
  var f = FIELDS[field], inp = $(f.input), box = $(f.err);
  var msg = t(cfg('COPY.errors.' + res.key), { n: res.n });
  /* t() returns '' exactly when a variable failed to resolve, so the raw string
     still carries its {token}. Strip it: a brace token must never reach a
     visitor, least of all on the screen where we are asking for trust. */
  if (!msg) msg = String(cfg('COPY.errors.' + res.key, '')).replace(/\s*\{\w+\}\s*/g, ' ').trim();
  box.hidden = false;
  box.lastChild.textContent = cfg('COPY.errors.prefix') + ' ' + msg;
  inp.setAttribute('aria-invalid','true');
  var ids = (inp.getAttribute('aria-describedby')||'').split(' ').filter(Boolean);
  if (ids.indexOf(box.id) < 0) ids.push(box.id);
  inp.setAttribute('aria-describedby', ids.join(' '));
  return msg;
}
function clearError(field){
  var f = FIELDS[field], inp = $(f.input), box = $(f.err);
  box.hidden = true; box.lastChild.textContent = '';
  inp.removeAttribute('aria-invalid');
  var ids = (inp.getAttribute('aria-describedby')||'').split(' ').filter(function(x){ return x && x !== box.id; });
  if (ids.length) inp.setAttribute('aria-describedby', ids.join(' '));
  else inp.removeAttribute('aria-describedby');
}
function clearConsentError(){
  var box = $('#fConsent'); if (!box) return;
  box.removeAttribute('aria-invalid');
  var ids = (box.getAttribute('aria-describedby')||'').split(' ')
    .filter(function(x){ return x && x !== 'eConsent'; });
  if (ids.length) box.setAttribute('aria-describedby', ids.join(' '));
  else box.removeAttribute('aria-describedby');
}
function validateField(field){
  var res = FIELDS[field].run();
  if (res.ok){ clearError(field); return res; }
  showError(field, res); return res;
}

function onSubmit(e){
  e.preventDefault();
  if (state.submitted) return;                       /* single flight, hard */
  var res = { name: validateField('name'), phone: validateField('phone'), email: validateField('email') };
  var consentBox = $('#fConsent');
  var consentOk = !!consentBox.checked;      /* consent is never optional here */
  var cbox = $('#eConsent');
  if (!consentOk){
    cbox.hidden = false;
    cbox.lastChild.textContent = cfg('COPY.errors.prefix') + ' ' + cfg('COPY.errors.consent');
    /* The one required control whose error was not wired to it. */
    consentBox.setAttribute('aria-invalid','true');
    var cids = (consentBox.getAttribute('aria-describedby')||'').split(' ').filter(Boolean);
    if (cids.indexOf('eConsent') < 0) cids.push('eConsent');
    consentBox.setAttribute('aria-describedby', cids.join(' '));
  } else { cbox.hidden = true; cbox.lastChild.textContent = ''; clearConsentError(); }

  var order = ['name','phone','email'];
  var firstBad = '';
  order.forEach(function(k){ if (!firstBad && !res[k].ok) firstBad = k; });
  if (firstBad || !consentOk){
    /* No alertSay here. Every one of these messages already sits in a
       role="alert" anchored to its own control, and pushing the same string
       into the assertive region made screen readers say it twice. */
    var target = firstBad ? $(FIELDS[firstBad].input) : consentBox;
    if (target) target.focus();
    return;
  }
  var btn = $('#gSubmit');
  btn.setAttribute('aria-disabled','true');
  btn.setAttribute('aria-busy','true');
  btn.textContent = cfg('COPY.gate.submitting');
  state.submitted = true;
  state.submittedAt = Date.now();
  /* Record what actually happened. consent_given used to be a hardcoded true
     and consent_at was stamped unconditionally — a consent record is only
     evidence if it can also say no. */
  state.lead = {
    first_name: res.name.value, phone10: res.phone.value, e164: res.phone.e164,
    raw: $('#fPhone').value, email: res.email.value,
    consent_given: consentOk,
    consent_at: consentOk ? new Date().toISOString() : ''
  };
  say(cfg('COPY.gate.submitting'));
  tagsConsented = consentOk;
  loadTags();
  try {
    if (window.fbq && cfg('INTEGRATIONS.META_PIXEL_ID')){
      window.fbq('init', cfg('INTEGRATIONS.META_PIXEL_ID'), {
        em: state.lead.email, ph: '91' + state.lead.phone10,
        fn: state.lead.first_name.toLowerCase(), country: 'in'
      });
    }
  } catch(err){ noteTagFailure('advanced_matching','fbq_threw'); }
  if (!state.leadEventFired){
    state.leadEventFired = true;
    track('lead_submitted', {
      event_id: state.submissionId, value: state.result.total, currency:'INR',
      tier: state.result.tier.id, biggest: state.result.biggest, qualified: state.result.qualified
    });
  }
  renderResult();
  goTo('result', { replace:true });
  revealMoney();
  /* The pixel writes _fbp AFTER fbevents.js loads, and loadTags() ran three
     lines ago — building the payload in this same tick ships fbp:'' on every
     lead that ticked and submitted immediately. Give the cookie a moment, but
     never at the cost of the lead: pagehide fires it early if they leave. */
  var needsFbp = !!cfg('INTEGRATIONS.META_PIXEL_ID') && !getCookie('_fbp');
  if (needsFbp){
    var fired = false;
    var fire = function(){ if (fired) return; fired = true; send(buildPayload()); };
    setTimeout(fire, 500);
    window.addEventListener('pagehide', fire);
  } else {
    send(buildPayload());
  }
}

/* ══════════════════════════════════════════════════════════════════════════════
   THE MONEY REVEAL
   ══════════════════════════════════════════════════════════════════════════════ */
/* Measure against the parent's CONTENT box. clientWidth includes padding, and
   the result panel carries 18px of it on each side — so the loop used to exit
   with the figure up to 36px past the edge it was supposed to fit inside, and
   that overflow is document-level, not clipped. */
function fitMoney(fig){
  if (!fig || !fig.parentElement) return;
  var box = fig.parentElement;
  fig.classList.remove('money--wrap');
  fig.style.removeProperty('font-size');
  var cs = getComputedStyle(box);
  var avail = box.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0);
  if (!(avail > 0)) return;                 /* screen still hidden: nothing to measure */
  var px = parseFloat(getComputedStyle(fig).fontSize);
  for (var i=0; i<10 && fig.scrollWidth > avail; i++){
    px -= 2; fig.style.setProperty('font-size', px + 'px');
    if (px <= 30) break;
  }
  if (fig.scrollWidth > avail) fig.classList.add('money--wrap');
}
function countUp(node, target, done){
  var D = num(CONFIG.BEHAVIOUR.COUNTUP_MS) || 1200, t0 = performance.now();
  var step = target >= 1000000 ? 5000 : target >= 100000 ? 1000 : 100;
  var finished = false;
  function finish(){
    if (finished) return; finished = true;
    clearTimeout(guard);
    node.textContent = groupIN(String(target));   /* the last frame is exact */
    done();
  }
  /* A backgrounded tab pauses requestAnimationFrame. Without this guard the
     visitor could come back to a hero reading zero, which is the worst
     possible failure on the one screen that matters. */
  var guard = setTimeout(finish, D + 600);
  (function frame(now){
    if (finished) return;
    var p = Math.min(1, (now - t0) / D);
    if (p >= 1){ finish(); return; }
    var v = target * (1 - Math.pow(1-p, 3));
    node.textContent = groupIN(String(Math.round(v/step)*step));
    requestAnimationFrame(frame);
  })(t0);
}
function revealMoney(){
  var R = state.result; if (!R) return;
  var numNode = $('#rMoneyNum'), fig = $('#rMoney'), rail = $('#rRail');
  var settle = function(){
    fitMoney(fig);
    var live = $('#rMoneyLive');
    if (live) live.textContent = t(cfg('COPY.result.total_label')) + ': ' + formatINR(R.total) + '.';
    paintBars(!RM);
    var b1 = $('#rBasis'), b2 = $('#rBasis2');
    if (b1) b1.classList.add('on');
    if (b2) b2.classList.add('on');
  };
  if (RM){
    numNode.textContent = groupIN(String(R.total));
    rail.classList.add('instant');
    settle();
    return;
  }
  rail.classList.add('on');
  setTimeout(function(){ countUp(numNode, R.total, settle); }, 150);
}
function paintBars(animate){
  var rows = document.querySelectorAll('#rLeaks .track i');
  Array.prototype.forEach.call(rows, function(bar, i){
    var apply = function(){
      bar.classList.add(animate ? 'on' : 'instant');
      var x = bar.parentNode.parentNode.querySelector('.leakrow__x');
      if (x) x.classList.add('on');
    };
    if (animate) setTimeout(apply, 180 + i*90); else apply();
  });
}
