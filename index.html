      : I.feeModel === 'inhouse' ? 'an in-house team' : 'no one managing them');
  var trackDesc = I.wasteRate === 0 ? 'tracking you trust'
    : (I.wasteRate <= 0.03 ? 'mostly healthy tracking'
      : I.wasteRate <= 0.06 ? 'about half your revenue attributed' : 'tracking you do not trust');
  setTextKeep($('#rBasis'), t(cfg('COPY.result.basis'), {
    spend: formatINR(I.spendM), fee_desc: feeDesc, tools: formatINR(I.toolsM), tracking_desc: trackDesc
  }));
  setTextKeep($('#rMethodJump'), cfg('COPY.result.method_link'));
  setTextKeep($('#rBandLine'), R.total > 0
    ? t(cfg('COPY.result.band_label'), { low: formatINR(R.low), high: formatINR(R.high) }) : '');
  /* The same number said twice on purpose. Never printed as a rupee zero:
     under half a percent the reframing stops being useful and the line goes. */
  var per = R.share * 100;
  var perTxt = per >= 10 ? String(Math.round(per)) : String(Math.round(per*10)/10);
  setTextKeep($('#rShareLine'), (R.annual_spend > 0 && parseFloat(perTxt) > 0)
    ? (per >= 1 ? t(cfg('COPY.result.share_label'), { share: perTxt, per100: perTxt })
                : t(cfg('COPY.result.share_label_small'), { share: perTxt })) : '');
  setTextKeep($('#rCapNote'), R.capped ? t(cfg('COPY.result.cap_note'), {
    cap_pct: Math.round(M.MAX_TOTAL_SHARE_OF_SPEND*100) }) : '');

  /* 4 — verdict */
  var vh = $('#rVerdict'), vb = $('#rVerdictBody');
  if (!R.qualified){
    vh.textContent = cfg('COPY.result.unqualified_h2');
    vb.textContent = cfg('COPY.result.unqualified_body');
  } else if (R.small){
    vh.textContent = cfg('COPY.result.small_h2');
    vb.textContent = t(cfg('COPY.result.small_body'), { floor: formatINR(M.SMALL_LEAK_FLOOR_ANNUAL) });
  } else {
    vh.textContent = R.tier_material ? (R.tier.verdict_material || R.tier.verdict) : R.tier.verdict;
    vb.textContent = R.tier_material ? (R.tier.body_material || R.tier.body) : R.tier.body;
  }

  /* 5 — per-leak rows */
  setText($('#rWhereH'), cfg('COPY.result.where_h2'));
  var host = $('#rLeaks'); clear(host);
  CONFIG.LEAKS.forEach(function(L){
    var v = R.leaks[L.key];
    var row = el('div','leakrow');
    var top = el('div','leakrow__top');
    top.appendChild(el('p','meta', L.num + ' · ' + L.short));
    var amt = el('p', v > 0 ? 'num-lg leakrow__amt' : 'num-lg leakrow__amt nil',
                 v > 0 ? formatINR(v) : NIL + ' · CLEAN');
    top.appendChild(amt);
    row.appendChild(top);
    var pctOfTotal = R.total > 0 ? Math.round(v / R.total * 100) : 0;
    var track = el('div','track');
    var fill = el('i');
    fill.style.setProperty('--w', pctOfTotal + '%');
    track.appendChild(fill);
    track.setAttribute('role','img');
    track.setAttribute('aria-label', L.short + ', ' + (v > 0 ? formatINR(v) + ', ' + pctOfTotal + '% of your total leak.' : 'nothing modelled.'));
    row.appendChild(track);
    var why = v > 0 ? L.body
      : (L.key === 'fee' && (I.feeModel === 'pct' || I.feeModel === 'hybrid') && L.zero_under ? L.zero_under : L.zero_body);
    row.appendChild(el('p','leakrow__x', why));
    if (v > 0 && L.sting) row.appendChild(el('p','leakrow__sting', L.sting));
    host.appendChild(row);
  });

  /* 6 — the working */
  setTextKeep($('#rMethodH'), cfg('COPY.result.working_h2'));
  setTextKeep($('#rMethodBtnT'), cfg('COPY.result.working_btn'));
  var wrap = $('#rWorking'); clear(wrap);
  CONFIG.LEAKS.forEach(function(L){
    var line = el('p','wline');
    line.appendChild(el('b', null, L.num + ' ' + L.short));
    line.appendChild(document.createTextNode(R.working[L.key] || ''));
    wrap.appendChild(line);
  });
  /* Every constant the model used, printed. The landing page promises exactly
     this, so a constant that is not on this list is a broken promise — the
     recovery ratios and the band width used to be missing, and the tracking
     ladder had no stated basis anywhere. */
  var A = cfg('COPY.result.assumptions') || {};
  var pc = function(x){ return Math.round(num(x)*100); };
  var ladder = (questionById('q_tracking') || {options:[]}).options
    .map(function(o){ return pc(o.value) + '%'; }).join(' / ');
  var as = $('#rAssume'); clear(as);
  [ D.benchFromTable
      ? t(A.bench_table,   { bench: formatINR(D.benchM) })
      : t(A.bench_derived, { bench: formatINR(D.benchM),
                             floor: formatINR(M.BENCHMARK_FLOOR_MONTHLY),
                             share: Math.round(M.BENCHMARK_SHARE*1000)/10 }),
    t(A.automation, { pct: pc(M.OPS_AUTOMATABLE_SHARE) }),
    R.used_default_rate
      ? t(A.coordination_default, { hours: M.COORD_HOURS_PER_EXTRA_VENDOR_MONTHLY,
                                    rate: formatINR(I.opsHourly) })
      : t(A.coordination,         { hours: M.COORD_HOURS_PER_EXTRA_VENDOR_MONTHLY }),
    t(A.recovery, { fee: pc(M.RECOVERY.fee), ops: pc(M.RECOVERY.ops),
                    vendors: pc(M.RECOVERY.vendors), tools: pc(M.RECOVERY.tools),
                    tracking: pc(M.RECOVERY.tracking) }),
    R.total > 0 ? t(A.band, { pct: pc(M.BAND_PCT), unit: formatINR(R.band_unit) }) : '',
    t(A.tracking_basis, { ladder: ladder }),
    t(A.guards, { single: pc(M.MAX_SINGLE_LEAK_SHARE), total: pc(M.MAX_TOTAL_SHARE_OF_SPEND) }),
    A.exclusions || '',
    R.assumed_labels.length ? t(A.assumed, { list: R.assumed_labels.join(', ') }) : ''
  ].forEach(function(s){ if (s) as.appendChild(el('li', null, s)); });

  renderResultTail();
}

var ctaBound = false;
function renderResultTail(){
  var R = state.result, M = CONFIG.MODEL, I = R.inputs, D = R.detail;

  /* 7 — what changes, then what to fix first. compute() clamps every recovery
     figure to the leak above it, so the page structurally cannot over-promise.
     COPY.result.changes_h2 is the switch for the per-leak rows: blank, and the
     block renders "Fix this one first" alone. anyLeak is still counted over
     every leak either way, because it is what decides whether this block has
     anything to say at all. */
  var cb = $('#rChangesBlk'), ch = $('#rChanges'); clear(ch);
  var changesOn = !!cfg('COPY.result.changes_h2');
  var anyLeak = false;
  CONFIG.LEAKS.forEach(function(L){
    var v = R.leaks[L.key]; if (v <= 0) return;
    anyLeak = true;
    if (!changesOn) return;
    var row = el('div','fixrow');
    var top = el('div','fixrow__top');
    top.appendChild(el('p','h4', L.name));
    if (R.recovery[L.key] > 0) top.appendChild(el('p','fixrow__gain', 'up to ' + formatINR(R.recovery[L.key]) + ' back'));
    row.appendChild(top);
    row.appendChild(el('p','fixrow__d', L.fixed));
    row.appendChild(el('p','fixrow__n', cfg('COPY.result.changes_note')));
    ch.appendChild(row);
  });
  setHidden(cb, !anyLeak);
  if (anyLeak){
    setTextKeep($('#rChangesH'), cfg('COPY.result.changes_h2'));
    var big = R.biggest ? leakByKey(R.biggest) : null;
    if (big){
      /* With the rows off, "Fix this one first" is the block's only heading and
         has to look like one. It is still an h3 under the hidden h2, so the
         outline is unchanged — this is the type role, not the level. */
      var fh = $('#rFirstH');
      if (fh) fh.className = changesOn ? 'h4 sub' : 'd3';
      setTextKeep(fh, t(cfg('COPY.result.first_h'), { leak_name: big.name }));
      var fl = $('#rFirstFixes'); clear(fl);
      (cfg('FIXES.' + R.biggest, []) || []).forEach(function(f){ fl.appendChild(el('li', null, f)); });
    } else {
      setTextKeep($('#rFirstH'), ''); clear($('#rFirstFixes'));
    }
  }

  /* 8 — comparison table. The right column is each row minus the modelled
     recovery, so the difference strip and the block above it cannot disagree.
     COPY.result.table_cap is the switch: blank, and none of this is built —
     no rows, no totals, no difference strip, no notes. Nothing here feeds the
     payload or the WhatsApp message, both of which read compute() directly, so
     switching the table off changes what is drawn and nothing else. */
  var tableOn = !!cfg('COPY.result.table_cap');
  if (!tableOn){ setHidden($('#rCompareBlk'), true); clear($('#rTbody')); }
  else {
  var mgmt = D.pctAnnual + D.flatAnnual;
  var rows = [
    { k:'fee',      trad: mgmt },
    { k:'tools',    trad: I.toolsM * 12 },
    { k:'tracking', trad: R.leaks.tracking },
    { k:'vendors',  trad: R.leaks.vendors },
    { k:'ops',      trad: R.leaks.ops }
  ].filter(function(r){ return r.trad > 0; });
  var tb = $('#rTbody'); clear(tb);
  var totA = 0, totB = 0;
  rows.forEach(function(r){
    var L = leakByKey(r.k);
    var after = Math.max(0, r.trad - R.recovery[r.k]);
    totA += r.trad; totB += after;
    var tr = document.createElement('tr');
    var th = document.createElement('th'); th.scope = 'row'; th.textContent = L.table_label; tr.appendChild(th);
    var td1 = document.createElement('td'); td1.textContent = formatINR(r.trad); tr.appendChild(td1);
    var td2 = document.createElement('td');
    td2.className = after < r.trad ? 'colb better' : 'colb';
    td2.textContent = after > 0 ? formatINR(after) : NIL;
    tr.appendChild(td2);
    tb.appendChild(tr);
  });
  setHidden($('#rCompareBlk'), rows.length === 0);
  setTextKeep($('#rTableCap'), cfg('COPY.result.table_cap'));
  setTextKeep($('#rThA'), cfg('COPY.result.table_h_a'));
  setTextKeep($('#rThB'), cfg('COPY.result.table_h_b'));
  setTextKeep($('#rThC'), cfg('COPY.result.table_h_c'));
  setTextKeep($('#rTfL'), cfg('COPY.result.table_total'));
  $('#rTfB').textContent = totA > 0 ? formatINR(totA) : NIL;
  $('#rTfC').textContent = totB > 0 ? formatINR(totB) : NIL;
  var diff = totA - totB;
  var strip = $('#rDiff');
  if (diff > 0){
    setTextKeep($('#rDiffL'), cfg('COPY.result.diff_label'));
    $('#rDiffV').textContent = formatINR(diff);
    strip.hidden = false;
  } else { strip.hidden = true; }
  /* Three large numbers sit on this screen — the leak, the table total and the
     annual difference — and the last is smaller than the first. Say why, rather
     than leaving a CFO to reconcile it unaided. */
  setTextKeep($('#rDiffNote'), diff > 0
    ? t(cfg('COPY.result.diff_note'), { leak: formatINR(R.total), recover: formatINR(diff) }) : '');
  setTextKeep($('#rTableNote'), diff > 0 ? cfg('COPY.result.table_note') : cfg('COPY.result.diff_none'));
  var region = $('#rTableRegion');
  if (region) region.setAttribute('aria-label', cfg('COPY.result.table_cap') + ', scrollable');
  }

  /* 9 — proof. Text only, zero requests. Named-result slots stay empty.
     Its own arrays, NOT the landing page's: the visitor read "Who we are" on the
     way in, and shipped empty this whole block is absent from the result. */
  var rBk = cfg('PROOF.RESULT_BACKERS', []) || [], rSt = cfg('PROOF.RESULT_STATS', []) || [];
  renderProof($('#rBackers'), $('#rStats'), rBk, rSt);
  setHidden($('#rProofBlk'), !(rBk.length || rSt.length));

  /* 10 — the ask.
     NOTHING HERE IS REMOVED FROM THE DOM. This block used to delete #rDock (and
     with it #rCta) whenever a result had no call, and then dereference the same
     button on the next render — so an under-₹50K visitor who went Back, raised
     their spend and hit Recalculate hit a TypeError that aborted the rest of
     recalculate(): no result screen, no reveal, and the corrected lead never
     sent. Hidden, not removed, is the only safe shape for a re-rendered screen. */
  setTextKeep($('#rCtaH'), cfg('COPY.result.cta_h'));
  setTextKeep($('#rCtaBody'), cfg('COPY.result.cta_body'));
  /* The ref is only worth quoting when there is a call to quote it on. */
  var refCode = (state.submissionId || '').slice(-6).toUpperCase();
  setTextKeep($('#rCtaRef'), (R.show_call && refCode)
    ? t(cfg('COPY.result.ref_note'), { ref: refCode }) : '');
  setTextKeep($('#rKeep'), cfg('COPY.result.keep_this'));
  /* The WhatsApp group. Secondary by construction — .btn2, not .cta — and it
     renders on every result, including the ones we do not ask for a call on:
     a question is not a sale. No URL or no label → hidden, never a dead link. */
  var grpWrap = $('#rWaGroupWrap'), grpLink = $('#rWaGroup'),
      grpUrl = cfg('INTEGRATIONS.WHATSAPP_GROUP_URL'), grpLabel = cfg('COPY.result.wa_group');
  if (grpWrap && grpLink){
    if (grpUrl && grpLabel){ grpLink.href = grpUrl; grpLink.textContent = grpLabel; }
    setHidden(grpWrap, !(grpUrl && grpLabel));
  }
  var dock = $('#rDock'), btn = $('#rCta');
  var target = ctaTarget();
  if (!R.show_call){
    setHidden(dock, true);
    setTextKeep($('#rCtaH'), '');
    setTextKeep($('#rCtaBody'), R.qualified ? cfg('COPY.result.no_call_note')
                                            : cfg('COPY.result.no_call_note_unqualified'));
  } else if (!target){
    setHidden(dock, false);
    setHidden(btn, true);
    setTextKeep($('#rDockConsent'), '');
    setTextKeep($('#rDockNote'), cfg('COPY.result.cta_none_note'));
  } else if (btn){
    setHidden(dock, false);
    setHidden(btn, false);
    btn.href = target.href;
    btn.textContent = target.label;
    if (target.external){ btn.target = '_blank'; btn.rel = 'noopener'; }
    else { btn.removeAttribute('target'); btn.removeAttribute('rel'); }
    /* Bound once, ever. Re-binding on every render meant one click fired N+1
       dataLayer events after N recalculations, inflating exactly the conversion
       counts this funnel is optimised against. */
    if (!ctaBound){
      ctaBound = true;
      btn.addEventListener('click', function(){
        var tg = ctaTarget(), R2 = state.result;
        if (!tg || !R2) return;
        if (tg.kind === 'booking'){
          track('booking_cta_click', { event_id: state.submissionId + '_sched',
                                       tier: R2.tier.id, value: R2.total, currency:'INR' });
        } else {
          track(tg.kind === 'email' ? 'email_cta_click' : 'whatsapp_cta_click',
                { event_id: state.submissionId + '_cta', tier: R2.tier.id });
        }
      });
    }
    setTextKeep($('#rDockConsent'), target.external ? cfg('COPY.result.cta_consent') : '');
    setTextKeep($('#rDockNote'),
      target.kind === 'booking' ? cfg('COPY.result.cta_note')
    : target.kind === 'email'   ? cfg('COPY.result.cta_note_email')
                                : cfg('COPY.result.cta_note_wa'));
  }
}
/* The two arrays are passed in, not read here: the landing page and the result
   page draw this block from different slots, and only the landing one is filled
   in the shipped config. */
function renderProof(backersNode, statsNode, backers, stats){
  /* Hidden rather than removed: this runs again on every result re-render. */
  backers = backers || [];
  if (backersNode){
    clear(backersNode);
    backers.forEach(function(b){ backersNode.appendChild(el('li', null, b)); });
    setHidden(backersNode, !backers.length);
  }
  stats = stats || [];
  if (statsNode){
    clear(statsNode);
    stats.forEach(function(s){
      var li = document.createElement('li');
      li.appendChild(el('b', null, s.value));
      li.appendChild(el('span', null, s.label));
      statsNode.appendChild(li);
    });
    setHidden(statsNode, !stats.length);
  }
}

/* ══════════════════════════════════════════════════════════════════════════════
   THE WHATSAPP MESSAGE — built here so the automation forwards a finished
   message. Any line whose variables cannot all resolve is dropped whole, so a
   bracketed token can never propagate into an outbound message.
   ══════════════════════════════════════════════════════════════════════════════ */
function buildMessage(){
  if (!cfg('MESSAGE.ENABLED', false)) return '';
  var R = state.result; if (!R) return '';
  var big = R.biggest ? leakByKey(R.biggest) : null;
  var leakLines = CONFIG.LEAKS.map(function(L){
    var v = R.leaks[L.key];
    return '• ' + L.short + ': ' + (v > 0 ? formatINR(v) : 'nothing modelled');
  }).join('\n');
  var fixLines = big ? (cfg('FIXES.' + R.biggest, []) || []).map(function(f, i){
    return (i+1) + '. ' + f;
  }).join('\n') : '';
  var workingLines = CONFIG.LEAKS.map(function(L){
    return '• ' + L.short + ': ' + (R.working[L.key] || '');
  }).join('\n');
  var url = cfg('INTEGRATIONS.BOOKING_URL');
  var ctaLine = '';
  if (R.show_call){
    ctaLine = url ? t(cfg('MESSAGE.CTA_LINE_WITH_LINK'), { booking_url: url })
                  : (cfg('INTEGRATIONS.WHATSAPP_NUMBER') ? cfg('MESSAGE.CTA_LINE_NO_LINK') : '');
  }
  var vars = {
    total_display: formatINR(R.total),
    tier_name: R.tier.name,
    first_name: state.lead ? state.lead.first_name : '',
    leak_lines: leakLines,
    biggest_name: big ? big.name : '',
    biggest_display: big ? formatINR(R.leaks[R.biggest]) : '',
    biggest_body: big ? big.body : '',
    fix_lines: fixLines,
    working_lines: workingLines,
    cta_line: ctaLine,
    sender_name: cfg('MESSAGE.SENDER_NAME')
  };
  var out = [];
  (cfg('MESSAGE.BODY', []) || []).forEach(function(line){
    var s = tOrNull(line, vars);
    if (s === null) return;
    out.push(s);
  });
  /* Dropping a line whose variables did not resolve leaves its section header
     standing over nothing — the header carries no variables of its own. The
     tidiest prospect on the page (flat fee, lean stack, clean tracking, one
     vendor, no manual hours) has no biggest leak and no fixes, and so received
     the most broken message. Drop a header with nothing under it. */
  var isHeader = function(s){ return /^\*[^*]+\*$/.test(String(s).trim()); };
  var kept = [];
  for (var i=0; i<out.length; i++){
    if (isHeader(out[i])){
      var next = '';
      for (var j=i+1; j<out.length; j++){ if (String(out[j]).trim() !== ''){ next = out[j]; break; } }
      if (!next || isHeader(next)) continue;
    }
    kept.push(out[i]);
  }
  return kept.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* ══════════════════════════════════════════════════════════════════════════════
   PAYLOAD
   ══════════════════════════════════════════════════════════════════════════════ */
function deviceClass(){
  var w = window.innerWidth || 0;
  return w < 768 ? 'mobile' : (w < 1100 ? 'tablet' : 'desktop');
}
function inAppBrowser(){
  var ua = navigator.userAgent || '';
  if (/Instagram/i.test(ua)) return 'instagram';
  if (/FBAN|FBAV|FB_IAB/i.test(ua)) return 'facebook';
  if (/Line\//i.test(ua)) return 'line';
  if (/Snapchat/i.test(ua)) return 'snapchat';
  return '';
}
function buildPayload(){
  var R = state.result, I = R.inputs, D = R.detail, L = state.lead || {};
  var big = R.biggest ? leakByKey(R.biggest) : null;
  var ck = metaCookies();
  var p = {};
  var put = function(k,v){ p[k] = (v === undefined || v === null) ? '' : v; };

  put('submission_id', state.submissionId);
  put('payload_version', state.payloadVersion);
  /* Same key on every copy of this submission — the retry and the beacon carry
     it too, so a receiver can collapse a lead that was delivered more than once
     without having to guess. */
  put('idempotency_key', state.submissionId + '_v' + state.payloadVersion);
  put('first_name', L.first_name || '');
  put('whatsapp_e164', L.e164 || '');
  put('whatsapp_10', L.phone10 || '');
  put('whatsapp_raw', L.raw || '');
  put('email', L.email || '');
  /* OBSERVED, never asserted. A consent record that cannot say "no" is not an
     audit trail, it is a fabricated one. */
  put('consent_given', !!L.consent_given);
  put('consent_text_version', cfg('CONSENT.CONSENT_TEXT_VERSION'));
  put('consent_at', L.consent_at || '');

  var summary = [];
  CONFIG.QUESTIONS.forEach(function(q){
    var chosen = state.answers[q.id];
    var flat = Array.isArray(chosen) ? chosen.join('|') : chosen;   /* multi → 'a|b' */
    var o = optionOf(q.id, state.answers);
    if (q.payloadKey) put(q.payloadKey, flat || '');
    if (q.valueKey)   put(q.valueKey, o && o.value !== undefined ? o.value : 0);
    if (flat) summary.push(q.id + ':' + flat);
  });
  put('answers_summary', summary.join('|'));

  LEAK_KEYS.forEach(function(k){ put('leak_' + k + '_annual_inr', R.leaks[k]); });
  put('leak_total_annual_inr', R.total);
  put('leak_total_low_inr', R.low);
  put('leak_total_high_inr', R.high);
  put('leak_total_display', formatINR(R.total));
  put('leak_total_compact', compactINR(R.total));
  put('leak_monthly_inr', R.monthly);
  put('leak_share_of_spend', Math.round(R.share*10000)/10000);
  put('annual_ad_spend_inr', R.annual_spend);
  put('biggest_leak_key', R.biggest);
  put('biggest_leak_inr', R.biggest ? R.leaks[R.biggest] : 0);
  put('biggest_leak_name', big ? big.name : '');
  put('tier', R.tier.id);
  put('tier_name', R.tier.name);
  put('is_call_tier', !!R.show_call);
  /* Which copy the visitor actually saw on a low-ratio, high-absolute result. */
  put('is_tier_material', !!R.tier_material);
  put('is_qualified', !!R.qualified);
  put('is_small_leak', !!R.small);
  put('total_capped', !!R.capped);
  put('single_leak_capped', !!R.single_capped);
  put('assumed_inputs', R.assumed_inputs.join('|'));
  put('model_version', R.model_version);
  /* Per-leak, not just the total: a rep on the call has to be able to reproduce
     the "up to X back" figures the visitor is looking at. */
  LEAK_KEYS.forEach(function(k){ put('recovery_' + k + '_inr', R.recovery[k]); });
  put('recovery_total_inr', R.recovery_total);
  put('schedule_event_id', state.submissionId + '_sched');
  put('sales_brief', formatINR(I.spendM) + '/mo spend · ' + (
      I.feeModel === 'pct' ? (Math.round(I.feePct*1000)/10) + '% fee'
    : I.feeModel === 'hybrid' ? 'retainer + ' + (Math.round(I.feePct*1000)/10) + '%'
    : I.feeModel === 'flat' ? 'flat retainer'
    : I.feeModel === 'inhouse' ? 'in-house team' : 'self-run'
    ) + ' · ' + I.vendors + ' vendor(s) · tracking ' + Math.round(I.wasteRate*100) + '% unattributed'
      + ' · leak ' + compactINR(R.total) + '/yr · biggest: ' + (big ? big.short : 'none'));

  put('whatsapp_message', buildMessage());

  /* The loop already emits first_touch_landing_url with the correct value in
     both the fresh and the restored case. Re-putting the CURRENT landing_url
     over it reported second touch as first on exactly the restored sessions
     the 24-hour snapshot exists to rescue. */
  Object.keys(state.attribution).forEach(function(k){ put(k, state.attribution[k]); });
  put('fbp', ck.fbp); put('fbc', ck.fbc); put('fbc_synthesised', ck.fbc_synthesised);
  /* Blank-by-absence and blank-by-race are different problems downstream. */
  put('fbp_available', !!ck.fbp);

  /* Only what the consent notice enumerates and something actually uses.
     language, screen, viewport, prefers_dark and prefers_reduced_motion were
     all shipped and read by nothing — and an assistive-technology preference
     has no business in a sales CRM. */
  put('user_agent', String(navigator.userAgent||'').slice(0,500));
  try { put('timezone', Intl.DateTimeFormat().resolvedOptions().timeZone || ''); } catch(e){ put('timezone',''); }
  put('device_class', deviceClass());
  put('in_app_browser', inAppBrowser());

  put('funnel', 'revx_scale_tax');
  put('page_version', cfg('META.PAGE_VERSION'));
  put('started_at', state.startedAt ? new Date(state.startedAt).toISOString() : '');
  put('computed_at', state.computedAt ? new Date(state.computedAt).toISOString() : '');
  put('submitted_at', state.submittedAt ? new Date(state.submittedAt).toISOString() : '');
  put('seconds_to_complete', state.startedAt ? Math.round(((state.submittedAt||Date.now()) - state.startedAt)/1000) : 0);
  put('questions_answered', Object.keys(state.answers).length);
  put('corrections_made', state.corrections);
  put('restored_session', !!state.restored);
  put('tag_failures', Object.keys(state.tagFailures).map(function(k){ return k + ':' + state.tagFailures[k]; }).join('|'));
  return p;
}

/* ══════════════════════════════════════════════════════════════════════════════
   DELIVERY — the visitor's result never waits on this and is never blocked by it
   ══════════════════════════════════════════════════════════════════════════════ */
function softFailNotice(){
  var n = $('#rSoftFail');
  if (n){ n.textContent = cfg('COPY.errors.send_failed'); n.hidden = false; }
  alertSay(cfg('COPY.errors.send_failed'));
}
/* A recalculate re-sends. If the first attempt failed and the second succeeded,
   the old failure alert would still be on screen contradicting a delivery that
   did happen. */
function clearSoftFail(){
  var n = $('#rSoftFail');
  if (n){ n.hidden = true; n.textContent = ''; }
  alertSay('');
}
function send(payload){
  var url = cfg('INTEGRATIONS.WEBHOOK_URL');
  var body = JSON.stringify(payload);
  var idem = payload.idempotency_key || '';
  clearSoftFail();
  if (!url){
    /* DEBUG only. This object is the whole lead record — name, phone in three
       forms, email, every answer — and a global is readable by any script the
       tag container later injects. */
    if (DEBUG) window.__revxLastPayload = payload;
    console.warn('[revx] WEBHOOK_URL is empty — lead not transmitted.');
    track('lead_sink_unconfigured');
    return;
  }
  if (state.sending) return;
  state.sending = true;
  var attempt = 0;
  function beacon(){
    state.sending = false;
    var queued = false;
    try {
      /* text/plain keeps this a CORS simple request — a beacon cannot survive a
         preflight. The receiver must accept a text/plain body. */
      queued = navigator.sendBeacon(url, new Blob([body], { type:'text/plain' }));
    } catch(e){ queued = false; }
    if (queued) track('lead_sent_beacon');
    else { track('lead_send_unconfirmed'); softFailNotice(); }
  }
  function attemptSend(){
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, CONFIG.BEHAVIOUR.WEBHOOK_TIMEOUT_MS) : 0;
    var headers = {'Content-Type':'application/json'};
    /* The request is already preflighted by its content type, so this costs
       nothing, and it is what lets a receiver drop the second and third copy. */
    if (idem) headers['Idempotency-Key'] = idem;
    fetch(url, { method:'POST', headers: headers,
                 body: body, keepalive:true, signal: ctrl ? ctrl.signal : undefined })
      .then(function(r){ if (!r.ok) throw new Error(String(r.status)); return r; })
      .then(function(){
        clearTimeout(timer); state.sending = false;
        clearSoftFail();
        track('lead_sent'); clearSnapshot();
      })
      .catch(function(err){
        clearTimeout(timer);
        /* An abort means WE gave up, not that the server did — the request was
           very likely in flight and may already have been accepted. Retrying it
           immediately is how one lead became three. Fall through to the beacon,
           which carries the same idempotency key. */
        var aborted = !!(err && (err.name === 'AbortError' || err.code === 20));
        if (!aborted && attempt < 1){
          attempt++;
          setTimeout(attemptSend, CONFIG.BEHAVIOUR.WEBHOOK_RETRY_MS + Math.random()*400);
          return;
        }
        beacon();
      });
  }
  if (typeof fetch !== 'function'){ beacon(); return; }
  attemptSend();
}

function setMeta(sel, attr, key, value){
  var n = document.querySelector(sel);
  if (!value){ if (n && n.parentNode) n.parentNode.removeChild(n); return; }
  if (!n){
    n = document.createElement(attr === 'rel' ? 'link' : 'meta');
    if (attr === 'rel'){ n.rel = key; } else { n.setAttribute(attr, key); }
    document.head.appendChild(n);
  }
  if (attr === 'rel') n.href = value; else n.setAttribute('content', value);
}
function writeHead(){
  var title = cfg('META.TITLE'), desc = cfg('META.DESCRIPTION');
  if (title) document.title = title;
  setMeta('meta[name="description"]','name','description', desc);
  setMeta('meta[property="og:title"]','property','og:title', title);
  setMeta('meta[property="og:description"]','property','og:description', desc);
  setMeta('meta[property="og:locale"]','property','og:locale', cfg('META.LOCALE'));
  setMeta('meta[name="twitter:title"]','name','twitter:title', title);
  setMeta('meta[name="twitter:description"]','name','twitter:description', desc);
  /* Anything without a real value is REMOVED, never shipped as content="". */
  setMeta('meta[property="og:image"]','property','og:image', cfg('META.OG_IMAGE'));
  setMeta('meta[name="twitter:image"]','name','twitter:image', cfg('META.OG_IMAGE'));
  setMeta('meta[property="og:url"]','property','og:url', cfg('META.OG_URL') || cfg('META.CANONICAL'));
  setMeta('link[rel="canonical"]','rel','canonical', cfg('META.CANONICAL'));
  setMeta('meta[name="robots"]','name','robots', cfg('META.ROBOTS'));
}

function renderResume(snap){
  var host = $('#resumeSlot'); if (!host) return;
  clear(host);
  var answered = Object.keys(snap.answers || {}).filter(function(k){
    var q = questionById(k); return q && !q.inline;
  }).length;
  if (!answered) return;
  var C = cfg('COPY.resume');
  var h = snap.ageH || 0;
  var ago = h < 0.05 ? C.ago_now
          : h < 1 ? t(C.ago_min, { n: Math.max(1, Math.round(h*60)) })
          : h < 24 ? t(C.ago_hr, { n: Math.round(h) }) : C.ago_day;
  var body = t(C.body, { answered: answered, total: STEPS.length, ago: ago });
  if (!body) return;
  var box = el('div','resume');
  /* No aria-live: this node is built with its content already in place and
     then appended, and a live region can only announce a change that happens
     after it is in the DOM. It never fired, and it never could. */
  box.setAttribute('role','region');
  box.setAttribute('aria-label', C.title);
  box.appendChild(el('p','h4', C.title));
  box.appendChild(el('p','body-sm', body));

  var go = el('button','btn2', C.resume); go.type = 'button';
  var no = el('button','btn2', C.restart); no.type = 'button';
  go.addEventListener('click', function(){
    track('restore_accepted', { answered: answered });
    state.answers = snap.answers;
    state.submissionId = snap.submissionId || '';
    state.startedAt = snap.startedAt || Date.now();
    state.corrections = snap.corrections || 0;
    state.payloadVersion = snap.payloadVersion || state.payloadVersion;
    state.restored = true;
    /* Gate the merge on whether THIS visit carries any attribution at all, not
       on utm_source alone. A first touch from a Meta ad with no UTM template
       carries only fbclid, so the old test was false and the whole stored
       attribution — click id included — was thrown away on exactly the paid
       sessions the restore exists to rescue. */
    if (snap.attribution){
      var hasNew = UTM_KEYS.concat(CLICK_KEYS).some(function(k){ return state.attribution[k]; });
      if (!hasNew){
        Object.keys(snap.attribution).forEach(function(k){
          if (!state.attribution[k]) state.attribution[k] = snap.attribution[k];
        });
      }
    }
    state.attribution.first_touch_landing_url = (snap.attribution && snap.attribution.landing_url) || state.attribution.landing_url;
    state.attribution.first_touch_at = (snap.attribution && snap.attribution.first_touch_at) || state.attribution.first_touch_at;
    clear(host);
    /* A step is only complete when its revealed follow-up is answered too.
       Walking STEPS alone skipped a root whose child was still blank — the
       visitor was never asked "what percentage?", and the fee leak, which is
       the page's headline argument, silently computed as ₹0. */
    var target = STEPS[0];
    for (var i=0;i<STEPS.length;i++){
      if (state.answers[STEPS[i]] === undefined || pendingChild(STEPS[i])){ target = STEPS[i]; break; }
      target = STEPS[i];
    }
    goTo(screenIdFor(target));
  });
  no.addEventListener('click', function(){
    track('restore_declined', { answered: answered });
    clearSnapshot(); clear(host);
  });
  row.appendChild(go); row.appendChild(no);
  box.appendChild(row);
  host.appendChild(box);
  track('restore_offered', { answered: answered });
}

   BOOT

/* Every target is null-guarded. renderLanding() runs BEFORE wire() and used to
   be able to delete #startBtn (setText removes a node it is handed an empty
   string for), which threw here, aborted boot, and left the whole page inert
   with nothing wired at all. */
function on(sel, ev, fn){ var n = $(sel); if (n) n.addEventListener(ev, fn); return n; }
function wire(){
  on('#startBtn', 'click', function(){
    if (!state.startedAt) state.startedAt = Date.now();
    track('diagnostic_start');
    goTo(screenIdFor(STEPS[0]));
  });
  on('#nextBtn', 'click', onNext);
  on('#backBtn', 'click', function(){ history.back(); });
  on('#gForm', 'submit', onSubmit);
  ['name','email'].forEach(function(k){
    on(FIELDS[k].input, 'blur', function(){ if ($(FIELDS[k].input).value) validateField(k); });
  });
  var ph = $('#fPhone');
  ph.addEventListener('blur', function(){
    if (!ph.value) return;
    var r = normalisePhoneIN(ph.value);
    if (r.ok){
      clearError('phone');
      setText($('#fPhoneEcho'), t(cfg('COPY.gate.f_phone_echo'), { e164: prettyPhone(r.value) }));
    } else {
      var e = $('#fPhoneEcho'); if (e) e.textContent = '';
      showError('phone', r);
    }
  });
  $('#fConsent').addEventListener('change', function(){
    /* This is the ONLY place a visitor's measurement decision is recorded, in
       both directions. It used to call loadTags() and nothing else: tagsLoaded
       went true while tagsConsented stayed false, so track() short-circuited on
       every call from the tick until a successful submit, and unticking cleared
       nothing at all — on a page whose notice promises that withdrawing consent
       is as easy as giving it. GTM cannot be unloaded once injected, but from
       here nothing further is handed to either platform. */
    tagsConsented = this.checked;
    if (this.checked){
      loadTags();
      $('#eConsent').hidden = true;
      $('#eConsent').lastChild.textContent = '';
      clearConsentError();
    }
  });
  $('#rMethodBtn').addEventListener('click', function(){
    var wrap = $('#rMethodWrap'), open = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', open ? 'false' : 'true');
    wrap.classList.toggle('open', !open);
    setText($('#rMethodBtnT'), open ? cfg('COPY.result.working_btn') : cfg('COPY.result.working_btn_open'));
  });
  $('#rMethodJump').addEventListener('click', function(){ openMethod(true); });
  var resizeT;
  window.addEventListener('resize', function(){
    clearTimeout(resizeT);
    resizeT = setTimeout(function(){
      fitMoney($('#rMoney')); var g = $('#gTotal'); if (g) fitMoney(g.parentNode);
    }, 150);
  });
  window.addEventListener('popstate', function(e){
    var s = e.state && e.state.revx ? e.state.s : null;
    if (!s) return;
    track('history_back', { from: state.screen, to: s });
    if (s === 'gate'){
      if (state.submitted){
        goTo(lastQuestionScreen(), { fromHistory:true });
        enterReviewMode();
        return;
      }
      /* Re-entering the gate with the FORWARD button used to show whatever was
         computed before the visitor went back and changed an answer, and
         onSubmit would then render that stale estimate while the payload
         carried the new answers. Recompute, always. */
      var ready = STEPS.every(function(id){
        return state.answers[id] !== undefined && !pendingChild(id);
      });
      if (!ready){ goTo(lastQuestionScreen(), { fromHistory:true }); return; }
      state.result = compute(state.answers);
      state.computedAt = Date.now();
      renderGate(true);
    }
    goTo(s, { fromHistory:true });
    if (state.submitted && isQuestionScreen(s)) enterReviewMode();
  });
}
var _goTo = goTo;
goTo = function(id, opts){ _goTo(id, opts); renderFooter(); };

function boot(){
  applyBrand();
  writeHead();
  renderLanding();
  renderFooter();
  wire();
  pushHistory('landing', true);
  applyBg(state.screen || 'landing');

  /* PRE-LAUNCH GUARDS. Each one names a slot that is safe to leave empty while
     you are building the page and NOT safe to leave empty in front of traffic.
     In DEBUG they throw; otherwise they are loud in the console and the page
     still works, because a half-configured page must never become a dead one. */
  var launchGuard = function(bad, msg){
    if (!bad) return;
    if (DEBUG) throw new Error('[revx] ' + msg);
    console.error('[revx] ' + msg);
  };
  launchGuard(!cfg('INTEGRATIONS.CONTACT_EMAIL') && !cfg('INTEGRATIONS.WHATSAPP_NUMBER'),
    'Neither CONTACT_EMAIL nor WHATSAPP_NUMBER is set: the consent notice has no withdrawal route. Set one before taking live traffic.');
  /* DPDP s.13 wants a named grievance contact, and the disclosure line that
     carries one is dropped whole while either half is blank — so without this
     the notice simply goes quiet about it, which is the failure nobody sees. */
  launchGuard(!cfg('CONSENT.GRIEVANCE_NAME') || !cfg('CONSENT.GRIEVANCE_EMAIL'),
    'GRIEVANCE_NAME and GRIEVANCE_EMAIL are not both set: the consent notice names no grievance contact. DPDP requires one before taking live traffic.');
  /* The one exception to "any value you leave as '' disappears cleanly": these
     two label a control that is the only way forward on its screen. */
  launchGuard(!cfg('COPY.landing.cta'), 'COPY.landing.cta is empty: the landing screen has no way into the diagnostic.');
  launchGuard(!cfg('COPY.gate.submit'), 'COPY.gate.submit is empty: the gate has no submit control.');
  var snap = readSnapshot();
  if (snap && Object.keys(snap.answers||{}).length) renderResume(snap);

  if (DEBUG){
    window.__revx = {
      state: state, CONFIG: CONFIG, compute: compute, simulate: simulate,
      normalisePhoneIN: normalisePhoneIN, groupIN: groupIN, buildPayload: function(){ return buildPayload(); }
    };
    var check = function(){
      var box = $('#fConsent'), dock = document.querySelector('#screen-gate .dock');
      if (!box || !dock || $('#screen-gate').hidden) return;
      var a = box.getBoundingClientRect(), b = dock.getBoundingClientRect();
      if (a.bottom > b.top && a.top < b.bottom && getComputedStyle(dock).position === 'sticky'){
        console.error('[revx] consent checkbox is occluded by the sticky bar.');
      }
    };
    window.addEventListener('scroll', check); window.addEventListener('resize', check);
  }
}

/* ══════════════════════════════════════════════════════════════════════════════
   CALIBRATION HARNESS — DEBUG only. This is how the honesty claim is enforced:
   the tier split is measured, not asserted.
   ══════════════════════════════════════════════════════════════════════════════ */
function simulate(){
  var scored = CONFIG.QUESTIONS.filter(function(q){ return q.binds; });
  var roots = scored.filter(function(q){ return !q.inline; });
  var out = [], weights = [];
  function walk(idx, answers, w){
    if (idx >= roots.length){ out.push(Object.assign({}, answers)); weights.push(w); return; }
    var q = roots[idx];
    q.options.forEach(function(o){
      answers[q.id] = o.id;
      var kids = (DEPENDENTS[q.id]||[]).filter(function(r){ return r.when.indexOf(o.id) >= 0; })
                                       .map(function(r){ return r.child; });
      (function kidWalk(ki, kw){
        if (ki >= kids.length){ walk(idx+1, answers, w * (1/q.options.length) * kw); return; }
        var kq = questionById(kids[ki]);
        kq.options.forEach(function(ko){
          answers[kq.id] = ko.id;
          kidWalk(ki+1, kw * (1/kq.options.length));
          delete answers[kq.id];
        });
      })(0, 1);
      delete answers[q.id];
    });
  }
  walk(0, {}, 1);
  function tally(filter, weighted){
    var t2 = {}, n = 0, W = 0, capped = 0, mism = 0;
    CONFIG.TIERS.forEach(function(x){ t2[x.id] = 0; });
    out.forEach(function(a, i){
      if (filter && !filter(a)) return;
      var R = compute(a);
      var w = weighted ? weights[i] : 1;
      t2[R.tier.id] += w; n++; W += w;
      if (R.capped) capped += w;
      var sum = LEAK_KEYS.reduce(function(x,k){ return x + R.leaks[k]; }, 0);
      if (sum !== R.total) mism++;
    });
    var res = { n:n, sum_mismatches:mism, capped_pct: Math.round(1000*capped/W)/10 };
    CONFIG.TIERS.forEach(function(x){ res[x.id] = Math.round(1000*t2[x.id]/W)/10; });
    return res;
  }
  var qualified = function(a){ return a.q_spend !== 'lt50k'; };
  var report = {
    vectors: out.length,
    uniform_prior_qualified: tally(qualified, true),
    raw_cartesian_qualified: tally(qualified, false),
    raw_cartesian_all: tally(null, false)
  };
  var personas = {
    'clean flat-fee operator': { q_spend:'5_10l', q_fee_model:'flat', q_fee_flat:'f_50_1l', q_tools:'t_5_15',
      q_overlap:'o_none', q_tracking:'k_clean', q_vendors:'v_1', q_ops:'h_lt2' },
    '15% agency, 4 vendors, no tracking': { q_spend:'5_10l', q_fee_model:'pct', q_fee_pct:'p15', q_tools:'t_30_60',
      q_overlap:'o_most', q_tracking:'k_none', q_vendors:'v_4', q_ops:'h_10_20', q_ops_owner:'w_staff' },
    'below range': { q_spend:'lt50k', q_fee_model:'pct', q_fee_pct:'p15', q_tools:'t_5_15',
      q_overlap:'o_few', q_tracking:'k_half', q_vendors:'v_2', q_ops:'h_2_5', q_ops_owner:'w_staff' }
  };
  report.personas = {};
  Object.keys(personas).forEach(function(k){
    var R = compute(personas[k]);
    report.personas[k] = R.tier.id + ' · ' + formatINR(R.total) + ' · ' +
      (Math.round(R.share*1000)/10) + '% · call:' + R.show_call + ' · qualified:' + R.qualified;
  });
  var lowest = CONFIG.TIERS[0].id;
  report.pass_clean_reachable = report.uniform_prior_qualified[lowest] >= 5;
  report.pass_no_tier_over_45 = CONFIG.TIERS.every(function(x){ return report.uniform_prior_qualified[x.id] <= 45; });
  if (DEBUG) console.table(report.uniform_prior_qualified);
  return report;
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
